[package]
edition = "2021"
rust-version = "1.63"
name = "keepawake"
version = "0.4.3"
authors = ["Segev Finer <segev208@gmail.com>"]
build = "build.rs"
exclude = ["/tools/"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Keep your computer awake"
readme = "README.md"
keywords = [
    "caffeinate",
    "systemd-inhibit",
    "idle",
    "sleep",
    "power-management",
]
categories = ["command-line-utilities"]
license = "MIT"
repository = "https://github.com/segevfiner/keepawake-rs/"

[lib]
name = "keepawake"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
cfg-if = "1.0"

[dependencies.clap]
version = "4.3"
features = ["derive"]
optional = true

[dependencies.clap_complete]
version = "4.3"
optional = true

[dependencies.ctrlc]
version = "3.4"
features = ["termination"]
optional = true

[dependencies.shadow-rs]
version = "0.21"
optional = true

[dependencies.sysinfo]
version = "0.29"
optional = true

[build-dependencies]
shadow-rs = "0.21.0"
winres = "0.1.12"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "3.12"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[target."cfg(windows)".dependencies.windows]
version = "0.48"
features = ["Win32_System_Power"]

[profile.release]
