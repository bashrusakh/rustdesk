[package]
edition = "2021"
name = "tfc"
version = "0.7.0"
authors = ["Indiana Kernick <indiana.kernick@gmail.com>"]
build = "build.rs"
exclude = [
    ".gitignore",
    ".idea",
    "docs",
    "iOS_client",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The Fat Controller. A library for simulating mouse and keyboard events."
homepage = "https://github.com/indianakernick/The-Fat-Controller"
readme = "README.md"
keywords = [
    "keyboard",
    "mouse",
    "automation",
    "control",
]
categories = [
    "os::linux-apis",
    "os::macos-apis",
    "os::windows-apis",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/indianakernick/The-Fat-Controller"

[features]
