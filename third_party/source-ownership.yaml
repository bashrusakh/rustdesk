scan_policy:
  # Digest is SHA-256 over sorted records:
  # relative-path NUL kind NUL content-SHA256 LF. Link records additionally
  # bind the literal target text: relative-path NUL link NUL target-text NUL
  # target-content-SHA256 LF. Repository-ignored generated/IDE outputs are
  # excluded, so additions/removals/changes fail closed.
  #
  # Symlink policy is deliberately allowlist-only. These six source-preserved
  # links are the only links permitted in any declared owned root. Each target
  # must be a direct, relative link to a regular file inside its same owned
  # root; absolute, broken, outside-root, directory, reparse-point, and
  # chain-to-link targets are rejected.
  allowed_symlinks:
    third_party/flutter/uni_links/uni_links/LICENSE: ../LICENSE
    third_party/flutter/uni_links/uni_links/analysis_options.yaml: ../analysis_options.yaml
    third_party/flutter/uni_links/uni_links_platform_interface/LICENSE: ../LICENSE
    third_party/flutter/uni_links/uni_links_platform_interface/analysis_options.yaml: ../analysis_options.yaml
    third_party/flutter/uni_links/uni_links_web/LICENSE: ../LICENSE
    third_party/flutter/uni_links/uni_links_web/analysis_options.yaml: ../analysis_options.yaml
  # Only these deterministic suffixes may be skipped as binary contents during
  # forbidden-URL scanning. Metadata and source text are always decoded/scanned
  # regardless of suffix; all .gitmodules are scanned separately as UTF-8. The
  # scanner recognizes Sciter's SAr resource archive by content, not suffix.
  binary_suffixes:
    - .a
    - .bin
    - .dat
    - .dll
    - .dylib
    - .gif
    - .gz
    - .h264
    - .h265
    - .ico
    - .jpeg
    - .jpg
    - .kra
    - .lib
    - .pdf
    - .png
    - .so
    - .tar
    - .webp
    - .zip
  # These are the only forbidden-organization URLs permitted in owned source.
  # Each record binds one exact comment line and URL; executable source,
  # manifests, workflows, and .gitmodules have no reference-URL exceptions.
  allowed_reference_urls:
    - path: third_party/flutter/desktop_multi_window/lib/src/window_controller.dart
      line: 40
      content: '  // https://github.com/rustdesk-org/window_manager/blob/f19acdb008645366339444a359a45c3257c8b32e/lib/src/window_manager.dart#L470'
      url: 'https://github.com/rustdesk-org/window_manager/blob/f19acdb008645366339444a359a45c3257c8b32e/lib/src/window_manager.dart#L470'
      reason: source-preserved documentation only
    - path: third_party/flutter/desktop_multi_window/lib/src/window_controller.dart
      line: 102
      content: '  // https://github.com/rustdesk-org/rustdesk_desktop_multi_window/pull/26'
      url: 'https://github.com/rustdesk-org/rustdesk_desktop_multi_window/pull/26'
      reason: source-preserved documentation only
