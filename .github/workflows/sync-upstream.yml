name: sync upstream

on:
  schedule:
    - cron: "37 4 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream master into sync/upstream
        run: |
          git remote add upstream https://github.com/rustdesk/rustdesk.git
          git fetch --quiet upstream master
          git checkout -q -B sync/upstream origin/master
          if ! git merge --no-edit upstream/master; then
            echo "::error::Merge conflict: upstream/master into master needs manual resolution."
            git merge --abort
            exit 1
          fi
          git push --force-with-lease origin sync/upstream

      - name: Ensure rolling sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh pr list --repo "$REPO" --head sync/upstream --state open --json number | grep -q number; then
            echo "Rolling sync PR is open"
          else
            gh pr create --repo "$REPO" --base master --head sync/upstream \
              --title "Sync upstream rustdesk/rustdesk master" \
              --body "Rolling PR refreshed weekly by the \`sync upstream\` workflow (branch = fork master + upstream master, rebuilt each run).

No \`pull_request\` CI exists in this fork: the \`rustqs-*\` / \`CI\` / \`Full Flutter CI\` workflows validate the merged state after the PR is merged (push to \`master\`).

If the merge step fails, resolve \`upstream/master\` into \`master\` manually on the \`sync/upstream\` branch."
          fi
