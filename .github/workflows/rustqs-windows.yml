name: rustqs windows min test
# deskforge-workflow-identity-guard: v1
# Workflow сборки rustqs.exe (Flutter Windows) в форке rustdesk.
# Historical source note: the steps were adapted from build-for-windows-flutter@1.4.7.
# The current fork source/ref is 1.4.9; active dispatch uses a provider-derived
# outer workflow SHA and authenticated DFP1 only.
# (L1 config.rs server+key, L2 allowCustom+custom_.txt, L3 brand+rename exe).
#
# Единственный build path: provider-derived workflow_sha plus enc_payload —
# authenticated DFP1 AES-CBC + HMAC envelope from the API. Direct/manual runs
# without valid identities fail closed.
#
# Запуск из gh:
# Rollout prerequisite: dispatch only from a verified immutable protected workflow tag; GitHub dispatch ref selection is not atomically SHA-bound.
#   gh api repos/$REPO/actions/workflows/rustqs-windows.yml/dispatches -X POST \
#     -f 'ref=<verified-immutable-protected-workflow-tag>' -f inputs[workflow_sha]=$SHA -f inputs[enc_payload]=$BLOB

on:
  workflow_dispatch:
    inputs:
      enc_payload:
        description: 'Authenticated DFP1 payload from the API; manual runs without it fail closed.'
        required: false
        type: string
        default: ''
      workflow_sha:
        description: 'Provider-derived workflow execution SHA; DeskForge sets this internal guard input.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  verify_workflow_identity:
    permissions: {}
    runs-on: ubuntu-22.04
    steps:
      - name: Verify outer workflow identity
        shell: bash
        env:
          OUTER_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXECUTION_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$OUTER_WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "::error::outer workflow_sha must be a 40-64 character hexadecimal SHA"
            exit 1
          fi
          if [ "$OUTER_WORKFLOW_SHA" != "$EXECUTION_WORKFLOW_SHA" ]; then
            echo "::error::outer workflow_sha does not match github.sha"
            exit 1
          fi

  bridge:
    needs: verify_workflow_identity
    uses: ./.github/workflows/bridge.yml
    with:
      enc_payload: ${{ inputs.enc_payload }}
      workflow_sha: ${{ inputs.workflow_sha }}
    secrets: inherit

  prepare_branding_assets:
    # DeskForge #80 branding images (app_icon_url / app_logo_url / privacy_screen_url):
    # resolve once here so both the privacy-mode DLL build (third-party workflow) and
    # the client build consume verified local files instead of re-fetching. Only
    # absolute http(s) URLs are accepted here and in the resolve step; each image is
    # fetched under its per-field byte cap and validated by the single shared PNG
    # validator, which is shipped inside this artifact so every consumer runs the
    # same code. Empty payload fields skip the whole stage.
    outputs:
      branding_assets_artifact: ${{ steps.fetch_branding.outputs.branding_assets_artifact }}
      privacy_image_artifact: ${{ steps.fetch_branding.outputs.privacy_image_artifact }}
    needs: verify_workflow_identity
    permissions: {}
    runs-on: ubuntu-22.04
    steps:
      - name: 'Resolve and fetch branded images'
        id: fetch_branding
        env:
          ENC: ${{ inputs.enc_payload }}
          PAYLOAD_KEY: ${{ secrets.WORKFLOW_PAYLOAD_KEY }}
          OUTER_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXECUTION_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          RQS_PAYLOAD_MODE=encrypted
          if [ -z "${ENC:-}" ]; then
            echo "::error::manual/direct runs require an authenticated DFP1 payload; no build is permitted"
            exit 1
          fi
          if [ -z "${PAYLOAD_KEY:-}" ]; then
              echo "::error::enc_payload provided but secret WORKFLOW_PAYLOAD_KEY is not set in this repo"
              exit 1
            fi
            # DFP1 is authenticated encrypt-then-MAC; legacy/open envelopes are
            # intentionally rejected by the active build workflow.
            decrypt_payload() {
              local payload_dir magic material aes_key aes_iv ciphertext
              payload_dir=$(mktemp -d)
              magic=$(printf '%s' "$ENC" | base64 -d | dd bs=1 count=4 status=none)
              if [ "$magic" = "DFP1" ]; then
                ciphertext="$payload_dir/ciphertext"
                if ! material=$(PAYLOAD_KEY="$PAYLOAD_KEY" ENC="$ENC" python3 - "$ciphertext" <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import pathlib
          import sys

          raw = base64.b64decode(os.environ["ENC"], validate=True)
          if len(raw) <= 4 + 16 + 32:
              raise SystemExit("authenticated payload is truncated")
          ciphertext = raw[20:-32]
          if not ciphertext or len(ciphertext) % 16:
              raise SystemExit("authenticated payload ciphertext is invalid")
          derived = hashlib.pbkdf2_hmac("sha256", os.environ["PAYLOAD_KEY"].encode(), raw[4:20], 100000, 80)
          expected = hmac.new(derived[48:], raw[:-32], hashlib.sha256).digest()
          if not hmac.compare_digest(expected, raw[-32:]):
              raise SystemExit("authenticated payload integrity check failed")
          pathlib.Path(sys.argv[1]).write_bytes(ciphertext)
          print(derived[:32].hex())
          print(derived[32:48].hex())
          PY
                ); then
                  rm -rf "$payload_dir"
                  return 1
                fi
                aes_key=$(printf '%s\n' "$material" | sed -n '1p')
                aes_iv=$(printf '%s\n' "$material" | sed -n '2p')
                if ! openssl enc -d -aes-256-cbc -K "$aes_key" -iv "$aes_iv" -in "$ciphertext"; then
                  rm -rf "$payload_dir"
                  return 1
                fi
              else
                echo "::error::enc_payload must use the authenticated DFP1 envelope" >&2
                rm -rf "$payload_dir"
                return 1
              fi
              rm -rf "$payload_dir"
            }
            validate_authenticated_workflow_identity() {
              local decrypted="$1" inner_workflow_sha
              if ! printf '%s' "$decrypted" | jq -e 'type == "object"' >/dev/null; then
                echo "::error::authenticated payload must be an object"
                exit 1
              fi
              if ! printf '%s' "$decrypted" | jq -e 'has("workflow_sha") and (.workflow_sha | type == "string")' >/dev/null; then
                echo "::error::authenticated workflow_sha must be a string"
                exit 1
              fi
              inner_workflow_sha=$(printf '%s' "$decrypted" | jq -r '.workflow_sha')
              if [[ ! "$inner_workflow_sha" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
                echo "::error::authenticated workflow_sha must be a 40-64 character hexadecimal SHA"
                exit 1
              fi
              if [ "$inner_workflow_sha" != "$OUTER_WORKFLOW_SHA" ] || [ "$inner_workflow_sha" != "$EXECUTION_WORKFLOW_SHA" ]; then
                echo "::error::authenticated workflow_sha does not match outer workflow_sha and github.sha"
                exit 1
              fi
            }
            decrypted=$(decrypt_payload)
            validate_authenticated_workflow_identity "$decrypted"
            RQS_WORKFLOW_REPO=$(printf '%s' "$decrypted" | jq -r '.workflow_repo // ""')
            if ! printf '%s' "$decrypted" | jq -e '
              (.workflow_repo | type == "string") and
              (.app_icon_url == null or (.app_icon_url | type == "string")) and
              (.app_logo_url == null or (.app_logo_url | type == "string")) and
              (.privacy_screen_url == null or (.privacy_screen_url | type == "string"))
            ' >/dev/null; then
              echo "::error::encrypted payload branding image fields must be strings"
              exit 1
            fi
            if [ "${RQS_WORKFLOW_REPO,,}" != "${GITHUB_REPOSITORY,,}" ]; then
              echo "::error::authenticated workflow repository does not match this fork"
              exit 1
            fi
          reject_control_chars() {
            local field="$1" value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]] || LC_ALL=C printf '%s' "$value" | LC_ALL=C grep -q '[[:cntrl:]]'; then
              echo "::error::$field contains unsafe control characters"
              exit 1
            fi
          }
          validate_branding_url() {
            local field="$1" value="$2"
            if [ -z "$value" ]; then return 0; fi
            case "$value" in
              http://*|https://*) ;;
              *)
                echo "::error::$field must be an absolute http(s) URL; relative URLs (for example '/upload/...') cannot be fetched by this workflow and fail the build"
                exit 1 ;;
            esac
            if printf '%s' "$value" | grep -q '[[:space:]]'; then
              echo "::error::$field contains whitespace characters"
              exit 1
            fi
          }
          RQS_APP_ICON_URL=$(printf '%s' "$decrypted" | jq -r '.app_icon_url // ""')
          RQS_APP_LOGO_URL=$(printf '%s' "$decrypted" | jq -r '.app_logo_url // ""')
          RQS_PRIVACY_SCREEN_URL=$(printf '%s' "$decrypted" | jq -r '.privacy_screen_url // ""')
          reject_control_chars RQS_APP_ICON_URL "$RQS_APP_ICON_URL"
          reject_control_chars RQS_APP_LOGO_URL "$RQS_APP_LOGO_URL"
          reject_control_chars RQS_PRIVACY_SCREEN_URL "$RQS_PRIVACY_SCREEN_URL"
          validate_branding_url app_icon_url "$RQS_APP_ICON_URL"
          validate_branding_url app_logo_url "$RQS_APP_LOGO_URL"
          validate_branding_url privacy_screen_url "$RQS_PRIVACY_SCREEN_URL"

          staging="${RUNNER_TEMP}/deskforge-branding-assets"
          rm -rf "$staging"
          mkdir -p "$staging"

          # Single authoritative PNG validator. It is written here once and shipped
          # inside the one deskforge-branding-assets artifact, so the build-job
          # icon/logo consumers and the third-party privacy-screen consumer all run
          # byte-identical validation code. This job has no repository checkout
          # (permissions: {} and no actions/checkout), so the module cannot be read
          # from the repo; the build job's source checkout also replaces the tree, so
          # a repo file would not survive to the build consumers either.
          validator="${RUNNER_TEMP}/validate_branding_png.py"
          cat > "$validator" <<'PY'
          #!/usr/bin/env python3
          """Single authoritative validator for DeskForge branding PNG images.

          One implementation is used everywhere a branding PNG is accepted or consumed:

            * ``prepare_branding_assets`` writes it, runs it over the staging directory
              and ships it inside the single ``deskforge-branding-assets`` artifact;
            * the Windows client build (icon + logo consumers) and the third-party
              privacy-mode overlay consumer import it from that same artifact.

          The prepare job has no repository checkout (``permissions: {}`` and no
          ``actions/checkout``) and the build job's source checkout replaces the whole
          tree, so a repository file cannot be reached from every consumer.  Defining the
          contract once here and carrying it with the one branding artifact keeps every
          consumer on identical code.

          A branding PNG is accepted only when it is structurally whole and decodable:
          complete chunk stream (IHDR first, per-chunk CRC, mandatory IEND, no data after
          IEND), spec chunk ordering (PLTE only for indexed colour, exactly once and before
          the first IDAT; tRNS exactly once and before the first IDAT; consecutive IDAT
          chunks; no unknown critical chunk), a valid per-colour-type tRNS transparency
          sample, allowed compression/filter/interlace flags, bounded and exact
          decompression of the IDAT stream (never more than the IHDR-implied scanline byte
          count, and no trailing decompressed payload), and a full scanline/filter traversal.
          """

          import hashlib
          import json
          import pathlib
          import struct
          import sys
          import zlib

          PNG_SIGNATURE = b"\x89PNG\r\n\x1a\n"

          # Colour type -> samples per pixel for the accepted non-interlaced 8-bit PNG.
          _CHANNELS = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}

          # prepare_branding_assets field rules: name -> (max_w, max_h, max_bytes,
          # require_square, square_hint).  Kept exactly at the reviewed 1.4.9 gate.
          _STAGING_RULES = {
              # app-icon dimension rule lives in ONE layer: this prepare gate accepts any
              # square PNG up to 4096px (format/shape gate only); the build job's ICO
              # converter owns the final icon constraint (square, 16..256, with
              # nearest-neighbour downscale to 256 for larger provider icons).
              "app-icon.png": (
                  4096,
                  4096,
                  10 * 1024 * 1024,
                  True,
                  "must be square (used for exe/tray icon resources; larger square icons are downscaled to 256 px for the Windows ICO resources in the build job)",
              ),
              "app-logo.png": (4096, 4096, 10 * 1024 * 1024, False, ""),
              "privacy-screen.png": (
                  4096,
                  4096,
                  20 * 1024 * 1024,
                  False,
                  "(renders fullscreen while privacy mode is active)",
              ),
          }


          class PngError(Exception):
              """Raised when a branding PNG fails the shared validation contract."""


          class Png:
              """A validated, fully decoded 8-bit non-interlaced PNG."""

              __slots__ = ("width", "height", "color_type", "pixels", "plte", "trns")

              def __init__(self, width, height, color_type, pixels, plte, trns):
                  self.width = width
                  self.height = height
                  self.color_type = color_type
                  self.pixels = pixels  # unfiltered scanlines, filter byte removed
                  self.plte = plte
                  self.trns = trns

              def bgra(self):
                  """Return ``(BGRA bytes, width, height)``; > 256px is downscaled to 256."""
                  channels = _CHANNELS[self.color_type]
                  width = self.width
                  height = self.height
                  stride = width * channels
                  pixels = self.pixels
                  screen = bytearray(width * height * 4)
                  # tRNS names exactly one fully transparent sample: a 2-byte gray value
                  # (color type 0) or a 6-byte RGB value (color type 2); every other pixel
                  # stays opaque. Indexed transparency is the per-entry alpha table used
                  # below. The alpha color types (4/6) never carry tRNS (load() rejects it).
                  transparent_gray = None
                  transparent_rgb = None
                  if self.trns is not None and self.color_type == 0:
                      (transparent_gray,) = struct.unpack(">H", self.trns)
                  elif self.trns is not None and self.color_type == 2:
                      transparent_rgb = struct.unpack(">HHH", self.trns)
                  for y in range(height):
                      base = y * width * 4
                      row = pixels[y * stride:(y + 1) * stride]
                      for x in range(width):
                          sx = x * channels
                          dx = base + x * 4
                          if self.color_type == 6:
                              screen[dx], screen[dx + 1], screen[dx + 2], screen[dx + 3] = (
                                  row[sx + 2], row[sx + 1], row[sx], row[sx + 3],
                              )
                          elif self.color_type == 2:
                              alpha = 0 if transparent_rgb is not None and (
                                  row[sx], row[sx + 1], row[sx + 2]
                              ) == transparent_rgb else 255
                              screen[dx], screen[dx + 1], screen[dx + 2], screen[dx + 3] = (
                                  row[sx + 2], row[sx + 1], row[sx], alpha,
                              )
                          elif self.color_type == 4:
                              screen[dx], screen[dx + 1], screen[dx + 2], screen[dx + 3] = (
                                  row[sx], row[sx], row[sx], row[sx + 1],
                              )
                          elif self.color_type == 0:
                              alpha = 0 if transparent_gray is not None and row[sx] == transparent_gray else 255
                              screen[dx], screen[dx + 1], screen[dx + 2], screen[dx + 3] = (
                                  row[sx], row[sx], row[sx], alpha,
                              )
                          else:
                              index = row[sx]
                              if index * 3 + 2 >= len(self.plte):
                                  raise PngError("PNG palette index is out of range")
                              alpha = self.trns[index] if self.trns is not None and index < len(self.trns) else 255
                              screen[dx], screen[dx + 1], screen[dx + 2], screen[dx + 3] = (
                                  self.plte[index * 3 + 2],
                                  self.plte[index * 3 + 1],
                                  self.plte[index * 3],
                                  alpha,
                              )
                  if width > 256 or height > 256:
                      # exe resource icons must stay <= 256px: nearest-neighbour downscale.
                      target = 256
                      scaled = bytearray(target * target * 4)
                      for ty in range(target):
                          source_row = (ty * height // target) * width * 4
                          for tx in range(target):
                              source = source_row + (tx * width // target) * 4
                              dest = (ty * target + tx) * 4
                              scaled[dest:dest + 4] = screen[source:source + 4]
                      return bytes(scaled), target, target
                  return bytes(screen), width, height


          def _fail(message):
              raise PngError(message)


          def load(data, label="PNG", max_width=4096, max_height=4096, max_bytes=None,
                   require_square=False, square_hint=""):
              """Validate one branding PNG and return a decoded :class:`Png`.

              Raises :class:`PngError` for any structural, digest-independent defect.
              """
              if max_bytes is not None and len(data) > max_bytes:
                  _fail(label + " exceeds the byte cap (" + str(max_bytes) + ")")
              if len(data) < 33:
                  _fail(label + " is too small to be a PNG image")
              if data[:8] != PNG_SIGNATURE:
                  _fail(label + " is not a PNG image; provider image URLs must point to .png files")

              size = len(data)
              pos = 8
              count = 0
              ihdr = None
              chunks = []
              ended = False
              # Full structural walk of the chunk stream (fail on any truncation).
              while pos < size:
                  if ended:
                      _fail(label + " has data after IEND")
                  if size - pos < 8:
                      _fail(label + " ends inside a chunk header (truncated)")
                  (length,) = struct.unpack(">I", data[pos:pos + 4])
                  ctype = data[pos + 4:pos + 8]
                  if pos + 12 + length > size:
                      _fail(label + " chunk extends past its declared length (truncated)")
                  chunk = data[pos + 8:pos + 8 + length]
                  (crc,) = struct.unpack(">I", data[pos + 8 + length:pos + 12 + length])
                  if (zlib.crc32(ctype + chunk) & 0xFFFFFFFF) != crc:
                      _fail(label + " chunk CRC mismatch")
                  if count == 0 and ctype != b"IHDR":
                      _fail(label + " first chunk is not IHDR")
                  if ctype == b"IHDR":
                      if count != 0 or ihdr is not None:
                          _fail(label + " has an invalid IHDR placement")
                      ihdr = chunk
                  elif ctype == b"IEND":
                      if length != 0:
                          _fail(label + " has a malformed IEND chunk")
                      ended = True
                  chunks.append((ctype, chunk))
                  pos += 12 + length
                  count += 1

              if not ended:
                  _fail(label + " is truncated (no IEND chunk)")
              if ihdr is None or len(ihdr) != 13:
                  _fail(label + " has an unreadable IHDR chunk")
              width, height, depth, color_type, compression, filter_method, interlace = struct.unpack(
                  ">IIBBBBB", ihdr
              )
              if width == 0 or height == 0:
                  _fail(label + " has a zero dimension")
              if interlace != 0:
                  _fail(label + " is an interlaced PNG; only non-interlaced PNG is supported")
              if depth != 8:
                  _fail(label + " uses unsupported PNG bit depth " + str(depth) + "; 8-bit PNG is required")
              if compression != 0 or filter_method != 0:
                  _fail(label + " uses unsupported compression/filter method flags")
              channels = _CHANNELS.get(color_type)
              if channels is None:
                  _fail(label + " uses unsupported PNG color type " + str(color_type))
              if not 1 <= width <= max_width or not 1 <= height <= max_height:
                  _fail(
                      label + " has out-of-range dimensions " + str(width) + "x" + str(height)
                      + " (max " + str(max_width) + "x" + str(max_height) + ")"
                  )
              if require_square and width != height:
                  _fail(label + " " + square_hint if square_hint else label + " must be square")
              # Chunk-order and critical-chunk rules (PNG 1.2 section 3.3 / 5.6). A
              # structurally whole stream is not necessarily a decodable one: PLTE must
              # precede the first IDAT and appear at most once, tRNS must precede the first
              # IDAT and appear at most once, the IDAT chunks must be consecutive, and an
              # unknown critical chunk must never be silently ignored.
              plte = None
              trns = None
              idat_parts = []
              saw_idat = False
              previous_type = b"IHDR"
              for chunk_type, chunk in chunks:
                  if chunk_type == b"PLTE":
                      if plte is not None:
                          _fail(label + " has more than one PLTE chunk")
                      if saw_idat:
                          _fail(label + " has a PLTE chunk after the first IDAT")
                      plte = chunk
                  elif chunk_type == b"tRNS":
                      if trns is not None:
                          _fail(label + " has more than one tRNS chunk")
                      if saw_idat:
                          _fail(label + " has a tRNS chunk after the first IDAT")
                      trns = chunk
                  elif chunk_type == b"IDAT":
                      if saw_idat and previous_type != b"IDAT":
                          _fail(label + " has non-consecutive IDAT chunks")
                      saw_idat = True
                      idat_parts.append(chunk)
                  elif chunk_type in (b"IHDR", b"IEND"):
                      pass
                  elif chunk_type[0:1].isupper():
                      _fail(label + " contains an unknown critical chunk " + chunk_type.decode("latin-1"))
                  previous_type = chunk_type
              if color_type == 3:
                  if plte is None:
                      _fail(label + " palette PNG is missing its PLTE chunk")
                  if len(plte) % 3 != 0 or not 1 <= len(plte) // 3 <= 256:
                      _fail(label + " has an invalid PLTE chunk")
              elif plte is not None:
                  _fail(label + " has a PLTE chunk but is not an indexed (color type 3) PNG")
              if trns is not None:
                  if color_type == 3:
                      if len(trns) > len(plte) // 3:
                          _fail(label + " tRNS chunk is longer than the palette")
                  elif color_type == 0:
                      if len(trns) != 2:
                          _fail(label + " grayscale tRNS chunk must be exactly 2 bytes")
                  elif color_type == 2:
                      if len(trns) != 6:
                          _fail(label + " truecolor tRNS chunk must be exactly 6 bytes")
                  else:
                      _fail(label + " alpha color type " + str(color_type) + " must not carry a tRNS chunk")
              if not saw_idat:
                  _fail(label + " has no image data")

              idat = b"".join(idat_parts)
              stride = width * channels
              expected = height * (stride + 1)
              # Bounded decompression: never ask zlib for more than one byte beyond the
              # IHDR-implied scanline stream, so a decompression bomb cannot allocate
              # meaningfully more than the declared image size.
              try:
                  decompressor = zlib.decompressobj()
                  raw = decompressor.decompress(idat, expected + 1)
              except zlib.error as exc:
                  _fail(label + " image data is corrupt: " + str(exc))
              if len(raw) > expected:
                  _fail(
                      label + " image data contains more scanline bytes than the IHDR dimensions"
                      " allow (extra or trailing pixel data)"
                  )
              if not decompressor.eof or decompressor.unconsumed_tail:
                  _fail(label + " image data stream is incomplete or has trailing data")
              if len(raw) != expected:
                  _fail(label + " image data is incomplete (truncated)")

              # Full scanline/filter traversal: unfilter every row, rejecting unknown
              # filter types, and keep the unfiltered pixels for raster consumers.
              pixels = bytearray(height * stride)
              prev = bytearray(stride)
              off = 0
              poff = 0
              for _row in range(height):
                  ftype = raw[off]
                  off += 1
                  row = bytearray(raw[off:off + stride])
                  off += stride
                  for i in range(stride):
                      a_ = row[i - channels] if i >= channels else 0
                      b_ = prev[i]
                      c_ = prev[i - channels] if i >= channels else 0
                      if ftype == 1:
                          row[i] = (row[i] + a_) & 0xFF
                      elif ftype == 2:
                          row[i] = (row[i] + b_) & 0xFF
                      elif ftype == 3:
                          row[i] = (row[i] + (a_ + b_) // 2) & 0xFF
                      elif ftype == 4:
                          p_ = a_ + b_ - c_
                          pa, pb, pc = abs(p_ - a_), abs(p_ - b_), abs(p_ - c_)
                          pr = a_ if pa <= pb and pa <= pc else (b_ if pb <= pc else c_)
                          row[i] = (row[i] + pr) & 0xFF
                      elif ftype != 0:
                          _fail(label + " uses an unknown scanline filter")
                  pixels[poff:poff + stride] = row
                  poff += stride
                  prev = row
              # Indexed colour: every decoded pixel must address a real palette entry, and a
              # tRNS alpha table may not be longer than the palette it decorates. The raster
              # consumer (Png.bgra) already rejects an out-of-range index, but load() is what
              # every declared-acceptable check (logo and privacy consumers use load()/the CLI
              # only) trusts, so the same range rule must hold here: a PNG the validator
              # accepts must actually be decodable by every consumer.
              if color_type == 3:
                  entries = len(plte) // 3
                  for index in pixels:
                      if index >= entries:
                          _fail(label + " contains a palette index that is out of range")
              return Png(width, height, color_type, bytes(pixels), plte, trns)


          def prepare(staging):
              """Validate every staged branding image and write branding_manifest.json."""
              staging = pathlib.Path(staging)
              images = {}
              for name, (max_w, max_h, max_bytes, require_square, square_hint) in _STAGING_RULES.items():
                  path = staging / name
                  if not path.is_file():
                      continue
                  data = path.read_bytes()
                  try:
                      image = load(
                          data,
                          name,
                          max_width=max_w,
                          max_height=max_h,
                          max_bytes=max_bytes,
                          require_square=require_square,
                          square_hint=square_hint,
                      )
                  except PngError as exc:
                      print("::error::" + str(exc))
                      return 1
                  images[name] = {
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "bytes": len(data),
                      "width": image.width,
                      "height": image.height,
                  }
              if images:
                  (staging / "branding_manifest.json").write_text(
                      json.dumps({"images": images}), encoding="utf-8"
                  )
              print("branding assets staged: " + (", ".join(images) if images else "none"))
              return 0


          def main(argv):
              if not argv:
                  sys.stderr.write(
                      "usage: validate_branding_png.py <png-or-staging-dir>"
                      " [--label L] [--max-width N] [--max-height N] [--max-bytes N] [--require-square]\n"
                  )
                  return 2
              target = pathlib.Path(argv[0])
              label = None
              max_width = 4096
              max_height = 4096
              max_bytes = None
              require_square = False
              index = 1
              while index < len(argv):
                  option = argv[index]
                  if option == "--require-square":
                      require_square = True
                      index += 1
                      continue
                  if option in ("--label", "--max-width", "--max-height", "--max-bytes") and index + 1 < len(argv):
                      value = argv[index + 1]
                      if option == "--label":
                          label = value
                      elif option == "--max-width":
                          max_width = int(value)
                      elif option == "--max-height":
                          max_height = int(value)
                      else:
                          max_bytes = int(value)
                      index += 2
                      continue
                  sys.stderr.write("unknown argument: " + option + "\n")
                  return 2
              if target.is_dir():
                  return prepare(target)
              if not target.is_file():
                  print("::error::" + str(target) + " is missing")
                  return 1
              name = label or target.name
              try:
                  image = load(
                      target.read_bytes(),
                      name,
                      max_width=max_width,
                      max_height=max_height,
                      max_bytes=max_bytes,
                      require_square=require_square,
                  )
              except PngError as exc:
                  print("::error::" + str(exc))
                  return 1
              print(
                  name + " verified: structurally complete and decodable "
                  + str(image.width) + "x" + str(image.height)
              )
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY
          chmod 700 "$validator"

          # Per-field caps (DeskForge #80). The cap is bound during the transfer by
          # reading at most cap+1 bytes off the response stream, so an oversized body
          # is aborted at fetch and never reaches the manifest or any downstream
          # consumer. This does not rely on HTTP Content-Length and is independent of
          # the runner's curl version: curl --max-filesize only aborts an unknown-length
          # body from curl 8.4.0 on, while the ubuntu-22.04 runner ships curl 7.81.0,
          # where a chunked (or understated Content-Length) response would otherwise be
          # downloaded in full before any post-download check. The transfer is pinned to
          # HTTP(S) for both the initial request and any redirect, so an allowed https
          # provider URL cannot be followed to a non-HTTP scheme.
          fetch_branding_image() {
            local field="$1" url="$2" out="$3" cap="$4"
            if [ -z "$url" ]; then return 0; fi
            local part="${out}.part"
            rm -f -- "$part"
            # Stream the response through a bounded reader: at most cap+1 bytes are
            # read, so an oversized body is cut off at fetch time and curl stops with a
            # broken pipe as soon as the cap is passed. This is Content-Length
            # independent and works on the runner's curl 7.81.0 (see the note above).
            # --proto/--proto-redir keep both the initial request and redirects on
            # http(s) only, matching the absolute-http(s) URL gate above.
            local fetch_failed=0
            if ! curl -fsSL --retry 2 --retry-delay 2 --max-time 120 \
                --proto '=http,https' --proto-redir '=http,https' \
                --output - -- "$url" | head -c "$((cap + 1))" > "$part"; then
              fetch_failed=1
            fi
            local bytes
            bytes=$(wc -c < "$part")
            if [ "$bytes" -gt "$cap" ]; then
              rm -f -- "$part"
              echo "::error::$field image exceeds the per-field byte cap (${cap} bytes)"
              exit 1
            fi
            if [ "$fetch_failed" -ne 0 ]; then
              rm -f -- "$part"
              echo "::error::$field image fetch failed from the provider URL (absolute http(s) URL required; the runner cannot fetch relative URLs; the response must stay within the ${cap}-byte cap)"
              exit 1
            fi
            mv -- "$part" "$out"
          }
          fetch_branding_image app_icon_url "$RQS_APP_ICON_URL" "$staging/app-icon.png" $((10 * 1024 * 1024))
          fetch_branding_image app_logo_url "$RQS_APP_LOGO_URL" "$staging/app-logo.png" $((10 * 1024 * 1024))
          fetch_branding_image privacy_screen_url "$RQS_PRIVACY_SCREEN_URL" "$staging/privacy-screen.png" $((20 * 1024 * 1024))

          # Validate every staged image and write branding_manifest.json with the same
          # module that is shipped to the consumers.
          if ! python3 "$validator" "$staging"; then
            echo "::error::branding image sanity checks failed"
            exit 1
          fi
          cp -- "$validator" "$staging/validate_branding_png.py"

          if [ ! -f "$staging/branding_manifest.json" ]; then
            echo "no DeskForge branding images requested; skipping"
            exit 0
          fi
          {
            echo "branding_assets_artifact=deskforge-branding-assets"
            if [ -f "$staging/privacy-screen.png" ]; then
              echo "privacy_image_artifact=deskforge-branding-assets"
            else
              echo "privacy_image_artifact="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: 'Upload branded image assets'
        if: steps.fetch_branding.outputs.branding_assets_artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskforge-branding-assets
          path: ${{ runner.temp }}/deskforge-branding-assets
          if-no-files-found: error
          retention-days: 7

  topmost:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    needs: [bridge, prepare_branding_assets]
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
      # DeskForge #80: brand the privacy-mode overlay image inside WindowInjection
      # when DFP1 carries privacy_screen_url (artifact prepared by
      # prepare_branding_assets; empty when the payload field is absent).
      privacy-image-artifact: ${{ needs.prepare_branding_assets.outputs.privacy_image_artifact }}

  build:
    needs: [verify_workflow_identity, bridge, topmost, prepare_branding_assets]
    runs-on: windows-2022
    steps:
      # Resolve the authenticated DFP1 build config. The former open-input debug
      # fallback is historical/superseded. Output is env vars RQS_*, masked in logs.
      - name: 'Resolve authenticated build config'
        shell: bash
        env:
          ENC: ${{ inputs.enc_payload }}
          PAYLOAD_KEY: ${{ secrets.WORKFLOW_PAYLOAD_KEY }}
          OUTER_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXECUTION_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          RQS_PAYLOAD_MODE=encrypted
          if [ -z "${ENC:-}" ]; then
            echo "::error::manual/direct runs require an authenticated DFP1 payload; no build is permitted"
            exit 1
          fi
          if [ -z "${PAYLOAD_KEY:-}" ]; then
              echo "::error::enc_payload provided but secret WORKFLOW_PAYLOAD_KEY is not set in this repo"
              exit 1
            fi
            echo "Resolve mode: ENCRYPTED (enc_payload, len ${#ENC})"
            # DFP1 is authenticated encrypt-then-MAC; legacy/open envelopes are
            # intentionally rejected by the active build workflow.
            decrypt_payload() {
              local payload_dir magic material aes_key aes_iv ciphertext
              payload_dir=$(mktemp -d)
              magic=$(printf '%s' "$ENC" | base64 -d | dd bs=1 count=4 status=none)
              if [ "$magic" = "DFP1" ]; then
                ciphertext="$payload_dir/ciphertext"
                if ! material=$(PAYLOAD_KEY="$PAYLOAD_KEY" ENC="$ENC" python3 - "$ciphertext" <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import pathlib
          import sys

          raw = base64.b64decode(os.environ["ENC"], validate=True)
          if len(raw) <= 4 + 16 + 32:
              raise SystemExit("authenticated payload is truncated")
          ciphertext = raw[20:-32]
          if not ciphertext or len(ciphertext) % 16:
              raise SystemExit("authenticated payload ciphertext is invalid")
          derived = hashlib.pbkdf2_hmac("sha256", os.environ["PAYLOAD_KEY"].encode(), raw[4:20], 100000, 80)
          expected = hmac.new(derived[48:], raw[:-32], hashlib.sha256).digest()
          if not hmac.compare_digest(expected, raw[-32:]):
              raise SystemExit("authenticated payload integrity check failed")
          pathlib.Path(sys.argv[1]).write_bytes(ciphertext)
          print(derived[:32].hex())
          print(derived[32:48].hex())
          PY
                ); then
                  rm -rf "$payload_dir"
                  return 1
                fi
                aes_key=$(printf '%s\n' "$material" | sed -n '1p')
                aes_iv=$(printf '%s\n' "$material" | sed -n '2p')
                if ! openssl enc -d -aes-256-cbc -K "$aes_key" -iv "$aes_iv" -in "$ciphertext"; then
                  rm -rf "$payload_dir"
                  return 1
                fi
              else
                echo "::error::enc_payload must use the authenticated DFP1 envelope" >&2
                rm -rf "$payload_dir"
                return 1
              fi
              rm -rf "$payload_dir"
            }
            validate_authenticated_workflow_identity() {
              local decrypted="$1" inner_workflow_sha
              if ! printf '%s' "$decrypted" | jq -e 'type == "object" and (.workflow_sha | type == "string")' >/dev/null; then
                echo "::error::authenticated workflow_sha must be a string"
                exit 1
              fi
              inner_workflow_sha=$(printf '%s' "$decrypted" | jq -r '.workflow_sha')
              if [[ ! "$inner_workflow_sha" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
                echo "::error::authenticated workflow_sha must be a 40-64 character hexadecimal SHA"
                exit 1
              fi
              if [ "$inner_workflow_sha" != "$OUTER_WORKFLOW_SHA" ] || [ "$inner_workflow_sha" != "$EXECUTION_WORKFLOW_SHA" ]; then
                echo "::error::authenticated workflow_sha does not match outer workflow_sha and github.sha"
                exit 1
              fi
            }
            decrypted=$(decrypt_payload)
            validate_authenticated_workflow_identity "$decrypted"
            RQS_SERVER=$(printf '%s' "$decrypted" | jq -r '.server // ""')
            RQS_KEY=$(printf '%s' "$decrypted" | jq -r '.key // ""')
            RQS_APP=$(printf '%s' "$decrypted" | jq -r '.app_name // ""')
            RQS_CT=$(printf '%s' "$decrypted" | jq -r '.custom_txt // ""')
            RQS_VERSION=$(printf '%s' "$decrypted" | jq -r '.version // ""')
            RQS_SOURCE_SHA=$(printf '%s' "$decrypted" | jq -r '.source_sha // ""')
            RQS_WORKFLOW_REPO=$(printf '%s' "$decrypted" | jq -r '.workflow_repo // ""')
            RQS_RELEASE_REPO=$(printf '%s' "$decrypted" | jq -r '.release_repo // ""')
            RQS_RELEASE_ASSETS=$(printf '%s' "$decrypted" | jq -c '.release_assets // empty')
            # DeskForge DFP1 branding fields (DeskForge issue #80): optional snake_case
            # strings, present in the encrypted payload only when non-empty. Text fields
            # are applied by the anchored L3 branding step; the *_url image fields are
            # fetched by prepare_branding_assets and consumed as sha256-verifiable
            # artifacts. custom_txt still flows to custom_.txt unmodified (runtime
            # identity), so these keys never enter custom_.txt.
            RQS_COMPANY_NAME=$(printf '%s' "$decrypted" | jq -r '.company_name // ""')
            RQS_DOWNLOAD_URL=$(printf '%s' "$decrypted" | jq -r '.download_url // ""')
            RQS_WEBSITE_URL=$(printf '%s' "$decrypted" | jq -r '.website_url // ""')
            RQS_PRIVACY_POLICY_URL=$(printf '%s' "$decrypted" | jq -r '.privacy_policy_url // ""')
            RQS_APP_ICON_URL=$(printf '%s' "$decrypted" | jq -r '.app_icon_url // ""')
            RQS_APP_LOGO_URL=$(printf '%s' "$decrypted" | jq -r '.app_logo_url // ""')
            RQS_PRIVACY_SCREEN_URL=$(printf '%s' "$decrypted" | jq -r '.privacy_screen_url // ""')
            if ! printf '%s' "$decrypted" | jq -e '
              (.server == null or (.server | type == "string")) and
              (.key == null or (.key | type == "string")) and
              (.app_name == null or (.app_name | type == "string")) and
              (.custom_txt == null or (.custom_txt | type == "string")) and
              (.company_name == null or (.company_name | type == "string")) and
              (.download_url == null or (.download_url | type == "string")) and
              (.website_url == null or (.website_url | type == "string")) and
              (.privacy_policy_url == null or (.privacy_policy_url | type == "string")) and
              (.app_icon_url == null or (.app_icon_url | type == "string")) and
              (.app_logo_url == null or (.app_logo_url | type == "string")) and
              (.privacy_screen_url == null or (.privacy_screen_url | type == "string")) and
              (.version == null or (.version | type == "string")) and
              (.source_sha == null or (.source_sha | type == "string")) and
              (.release_repo == null or (.release_repo | type == "string")) and
              (.workflow_repo | type == "string")
            ' >/dev/null; then
              echo "::error::encrypted payload env-bound fields must be strings"
              exit 1
            fi
          if [ "${RQS_WORKFLOW_REPO,,}" != "${GITHUB_REPOSITORY,,}" ]; then
            echo "::error::authenticated workflow repository does not match this fork"
            exit 1
          fi

          reject_control_chars() {
            local field="$1" value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]] || LC_ALL=C printf '%s' "$value" | LC_ALL=C grep -q '[[:cntrl:]]'; then
              echo "::error::$field contains unsafe control characters"
              exit 1
