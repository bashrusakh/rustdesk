          }
          if [ -n "$RQS_KEY" ]; then
            RQS_KEY=$(normalize_public_key "$RQS_KEY")
          fi
          for field_value in \
            "RQS_SERVER=$RQS_SERVER" \
            "RQS_KEY=$RQS_KEY" \
            "RQS_CUSTOM_TXT=$RQS_CT" \
            "RQS_VERSION=$RQS_VERSION" \
            "RQS_SOURCE_SHA=$RQS_SOURCE_SHA" \
            "RQS_WORKFLOW_REPO=$RQS_WORKFLOW_REPO" \
            "RQS_RELEASE_REPO=$RQS_RELEASE_REPO" \
            "RQS_RELEASE_ASSETS=$RQS_RELEASE_ASSETS" \
            "RQS_COMPANY_NAME=$RQS_COMPANY_NAME" \
            "RQS_DOWNLOAD_URL=$RQS_DOWNLOAD_URL" \
            "RQS_WEBSITE_URL=$RQS_WEBSITE_URL" \
            "RQS_PRIVACY_POLICY_URL=$RQS_PRIVACY_POLICY_URL" \
            "RQS_APP_ICON_URL=$RQS_APP_ICON_URL" \
            "RQS_APP_LOGO_URL=$RQS_APP_LOGO_URL" \
            "RQS_PRIVACY_SCREEN_URL=$RQS_PRIVACY_SCREEN_URL"; do
