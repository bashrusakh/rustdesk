name: rustqs windows min test
# deskforge-workflow-identity-guard: v1
# Workflow сборки rustqs.exe (Flutter Windows) в форке rustdesk.
# Historical source note: the steps were adapted from build-for-windows-flutter@1.4.7.
# The current fork source/ref is 1.4.9; active dispatch uses a provider-derived
# outer workflow SHA and authenticated DFP1 only.
# (L1 config.rs server+key, L2 allowCustom+custom_.txt, L3 brand+rename exe).
#
# Единственный build path: provider-derived workflow_sha plus enc_payload —
# authenticated DFP1 AES-CBC + HMAC envelope from the API. Direct/manual runs
# without valid identities fail closed.
#
# Запуск из gh:
# Rollout prerequisite: dispatch only from a verified immutable protected workflow tag; GitHub dispatch ref selection is not atomically SHA-bound.
#   gh api repos/$REPO/actions/workflows/rustqs-windows.yml/dispatches -X POST \
#     -f 'ref=<verified-immutable-protected-workflow-tag>' -f inputs[workflow_sha]=$SHA -f inputs[enc_payload]=$BLOB

on:
  workflow_dispatch:
    inputs:
      enc_payload:
        description: 'Authenticated DFP1 payload from the API; manual runs without it fail closed.'
        required: false
        type: string
        default: ''
      workflow_sha:
        description: 'Provider-derived workflow execution SHA; DeskForge sets this internal guard input.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  verify_workflow_identity:
    permissions: {}
    runs-on: ubuntu-22.04
    steps:
      - name: Verify outer workflow identity
        shell: bash
        env:
          OUTER_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXECUTION_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$OUTER_WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "::error::outer workflow_sha must be a 40-64 character hexadecimal SHA"
            exit 1
          fi
          if [ "$OUTER_WORKFLOW_SHA" != "$EXECUTION_WORKFLOW_SHA" ]; then
            echo "::error::outer workflow_sha does not match github.sha"
            exit 1
          fi

  bridge:
    needs: verify_workflow_identity
    uses: ./.github/workflows/bridge.yml
    with:
      enc_payload: ${{ inputs.enc_payload }}
      workflow_sha: ${{ inputs.workflow_sha }}
    secrets: inherit

  prepare_branding_assets:
    # DeskForge #80 branding images (app_icon_url / app_logo_url / privacy_screen_url):
    # resolve once here so both the privacy-mode DLL build (third-party workflow) and
    # the client build consume verified local files instead of re-fetching. Only
    # absolute http(s) URLs are accepted here and in the resolve step; each image is
    # fetched under its per-field byte cap and validated by the single shared PNG
    # validator, which is shipped inside this artifact so every consumer runs the
    # same code. Empty payload fields skip the whole stage.
    outputs:
      branding_assets_artifact: ${{ steps.fetch_branding.outputs.branding_assets_artifact }}
      privacy_image_artifact: ${{ steps.fetch_branding.outputs.privacy_image_artifact }}
    needs: verify_workflow_identity
    permissions: {}
    runs-on: ubuntu-22.04
    steps:
      - name: 'Resolve and fetch branded images'
        id: fetch_branding
        env:
          ENC: ${{ inputs.enc_payload }}
          PAYLOAD_KEY: ${{ secrets.WORKFLOW_PAYLOAD_KEY }}
          OUTER_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXECUTION_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          RQS_PAYLOAD_MODE=encrypted
          if [ -z "${ENC:-}" ]; then
            echo "::error::manual/direct runs require an authenticated DFP1 payload; no build is permitted"
            exit 1
          fi
          if [ -z "${PAYLOAD_KEY:-}" ]; then
              echo "::error::enc_payload provided but secret WORKFLOW_PAYLOAD_KEY is not set in this repo"
              exit 1
            fi
            # DFP1 is authenticated encrypt-then-MAC; legacy/open envelopes are
            # intentionally rejected by the active build workflow.
            decrypt_payload() {
              local payload_dir magic material aes_key aes_iv ciphertext
              payload_dir=$(mktemp -d)
              magic=$(printf '%s' "$ENC" | base64 -d | dd bs=1 count=4 status=none)
              if [ "$magic" = "DFP1" ]; then
                ciphertext="$payload_dir/ciphertext"
                if ! material=$(PAYLOAD_KEY="$PAYLOAD_KEY" ENC="$ENC" python3 - "$ciphertext" <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import pathlib
          import sys

          raw = base64.b64decode(os.environ["ENC"], validate=True)
          if len(raw) <= 4 + 16 + 32:
              raise SystemExit("authenticated payload is truncated")
          ciphertext = raw[20:-32]
          if not ciphertext or len(ciphertext) % 16:
              raise SystemExit("authenticated payload ciphertext is invalid")
          derived = hashlib.pbkdf2_hmac("sha256", os.environ["PAYLOAD_KEY"].encode(), raw[4:20], 100000, 80)
          expected = hmac.new(derived[48:], raw[:-32], hashlib.sha256).digest()
          if not hmac.compare_digest(expected, raw[-32:]):
              raise SystemExit("authenticated payload integrity check failed")
          pathlib.Path(sys.argv[1]).write_bytes(ciphertext)
          print(derived[:32].hex())
          print(derived[32:48].hex())
          PY
                ); then
                  rm -rf "$payload_dir"
                  return 1
                fi
                aes_key=$(printf '%s\n' "$material" | sed -n '1p')
                aes_iv=$(printf '%s\n' "$material" | sed -n '2p')
                if ! openssl enc -d -aes-256-cbc -K "$aes_key" -iv "$aes_iv" -in "$ciphertext"; then
                  rm -rf "$payload_dir"
                  return 1
                fi
              else
                echo "::error::enc_payload must use the authenticated DFP1 envelope" >&2
                rm -rf "$payload_dir"
                return 1
              fi
              rm -rf "$payload_dir"
            }
            validate_authenticated_workflow_identity() {
              local decrypted="$1" inner_workflow_sha
              if ! printf '%s' "$decrypted" | jq -e 'type == "object"' >/dev/null; then
                echo "::error::authenticated payload must be an object"
                exit 1
              fi
              if ! printf '%s' "$decrypted" | jq -e 'has("workflow_sha") and (.workflow_sha | type == "string")' >/dev/null; then
                echo "::error::authenticated workflow_sha must be a string"
                exit 1
              fi
              inner_workflow_sha=$(printf '%s' "$decrypted" | jq -r '.workflow_sha')
              if [[ ! "$inner_workflow_sha" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
                echo "::error::authenticated workflow_sha must be a 40-64 character hexadecimal SHA"
                exit 1
              fi
              if [ "$inner_workflow_sha" != "$OUTER_WORKFLOW_SHA" ] || [ "$inner_workflow_sha" != "$EXECUTION_WORKFLOW_SHA" ]; then
                echo "::error::authenticated workflow_sha does not match outer workflow_sha and github.sha"
                exit 1
              fi
            }
            decrypted=$(decrypt_payload)
            validate_authenticated_workflow_identity "$decrypted"
            RQS_WORKFLOW_REPO=$(printf '%s' "$decrypted" | jq -r '.workflow_repo // ""')
            if ! printf '%s' "$decrypted" | jq -e '
              (.workflow_repo | type == "string") and
              (.app_icon_url == null or (.app_icon_url | type == "string")) and
              (.app_logo_url == null or (.app_logo_url | type == "string")) and
              (.privacy_screen_url == null or (.privacy_screen_url | type == "string"))
            ' >/dev/null; then
              echo "::error::encrypted payload branding image fields must be strings"
              exit 1
            fi
            if [ "${RQS_WORKFLOW_REPO,,}" != "${GITHUB_REPOSITORY,,}" ]; then
              echo "::error::authenticated workflow repository does not match this fork"
              exit 1
            fi
          reject_control_chars() {
            local field="$1" value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]] || LC_ALL=C printf '%s' "$value" | LC_ALL=C grep -q '[[:cntrl:]]'; then
              echo "::error::$field contains unsafe control characters"
              exit 1
            fi
          }
          validate_branding_url() {
            local field="$1" value="$2"
            if [ -z "$value" ]; then return 0; fi
            case "$value" in
              http://*|https://*) ;;
              *)
                echo "::error::$field must be an absolute http(s) URL; relative URLs (for example '/upload/...') cannot be fetched by this workflow and fail the build"
                exit 1 ;;
            esac
            if printf '%s' "$value" | grep -q '[[:space:]]'; then
              echo "::error::$field contains whitespace characters"
              exit 1
            fi
          }
          RQS_APP_ICON_URL=$(printf '%s' "$decrypted" | jq -r '.app_icon_url // ""')
          RQS_APP_LOGO_URL=$(printf '%s' "$decrypted" | jq -r '.app_logo_url // ""')
          RQS_PRIVACY_SCREEN_URL=$(printf '%s' "$decrypted" | jq -r '.privacy_screen_url // ""')
          reject_control_chars RQS_APP_ICON_URL "$RQS_APP_ICON_URL"
          reject_control_chars RQS_APP_LOGO_URL "$RQS_APP_LOGO_URL"
          reject_control_chars RQS_PRIVACY_SCREEN_URL "$RQS_PRIVACY_SCREEN_URL"
          validate_branding_url app_icon_url "$RQS_APP_ICON_URL"
          validate_branding_url app_logo_url "$RQS_APP_LOGO_URL"
          validate_branding_url privacy_screen_url "$RQS_PRIVACY_SCREEN_URL"

          staging="${RUNNER_TEMP}/deskforge-branding-assets"
          rm -rf "$staging"
          mkdir -p "$staging"

          # Single authoritative PNG validator. It is written here once and shipped
          # inside the one deskforge-branding-assets artifact, so the build-job
          # icon/logo consumers and the third-party privacy-screen consumer all run
          # byte-identical validation code. This job has no repository checkout
          # (permissions: {} and no actions/checkout), so the module cannot be read
          # from the repo; the build job's source checkout also replaces the tree, so
          # a repo file would not survive to the build consumers either.
          validator="${RUNNER_TEMP}/validate_branding_png.py"
          cat > "$validator" <<'PY'
          #!/usr/bin/env python3
          """Single authoritative validator for DeskForge branding PNG images.

          One implementation is used everywhere a branding PNG is accepted or consumed:

            * ``prepare_branding_assets`` writes it, runs it over the staging directory
              and ships it inside the single ``deskforge-branding-assets`` artifact;
            * the Windows client build (icon + logo consumers) and the third-party
              privacy-mode overlay consumer import it from that same artifact.

          The prepare job has no repository checkout (``permissions: {}`` and no
          ``actions/checkout``) and the build job's source checkout replaces the whole
          tree, so a repository file cannot be reached from every consumer.  Defining the
          contract once here and carrying it with the one branding artifact keeps every
          consumer on identical code.

          A branding PNG is accepted only when it is structurally whole and decodable:
          complete chunk stream (IHDR first, per-chunk CRC, mandatory IEND, no data after
          IEND), four-letter chunk types, spec chunk ordering (PLTE exactly once and before
          the first IDAT, required for indexed colour and permitted as a suggested palette
          for truecolour 2/6 but forbidden for 0/4; tRNS exactly once and before the first
          IDAT, and for indexed colour after PLTE; consecutive IDAT chunks; no unknown
          critical chunk), a valid per-colour-type tRNS transparency sample, the
          compression/filter method flags pinned to 0, every bit depth the PNG
          specification permits for the colour type, either interlace method (none or
          Adam7), bounded and exact decompression of the IDAT stream (never more than the
          scanline byte count the IHDR and interlace layout imply, and neither trailing
          decompressed nor trailing compressed payload), a full per-pass scanline/filter
          traversal canonicalised to 8-bit BGRA, and a canonical 8-bit non-interlaced
          RGB/RGBA PNG re-encode that every consumer receives instead of the raw download.
          """

          import hashlib
          import json
          import pathlib
          import struct
          import sys
          import zlib

          PNG_SIGNATURE = b"\x89PNG\r\n\x1a\n"

          # Colour type -> samples per pixel. The decoded raster is canonicalised to 8 bits
          # per sample, so this is also the canonical channel count for every source depth.
          _CHANNELS = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}

          # Colour type -> the bit depths the PNG specification permits for it (PNG 1.2
          # 4.1.2 / 11.2.2): greyscale 1/2/4/8/16, truecolour and the two alpha types
          # 8/16, indexed colour 1/2/4/8 but never 16.
          _DEPTHS = {0: (1, 2, 4, 8, 16), 2: (8, 16), 3: (1, 2, 4, 8), 4: (8, 16), 6: (8, 16)}

          # Adam7 interlace passes as (xstart, ystart, xstep, ystep) (PNG 1.2 8.2).
          _ADAM7_PASSES = (
              (0, 0, 8, 8), (4, 0, 8, 8), (0, 4, 4, 8), (2, 0, 4, 4),
              (0, 2, 2, 4), (1, 0, 2, 2), (0, 1, 1, 2),
          )

          # Number of pixels along one axis for an interlace pass; zero means the pass
          # carries no data at all (no scanlines, hence no filter byte).
          def _pass_extent(size, start, step):
              if size <= start:
                  return 0
              return (size - start + step - 1) // step

          # PNG chunk types are exactly four ASCII letters A-Z / a-z (PNG 1.2 section
          # 5.3). A byte outside that set is a malformed chunk, not an ignorable
          # ancillary chunk: the ancillary/critical distinction only exists for a valid
          # type, so a non-letter type must be rejected rather than silently skipped.
          def _valid_chunk_type(chunk_type):
              return len(chunk_type) == 4 and all(
                  0x41 <= byte <= 0x5A or 0x61 <= byte <= 0x7A for byte in chunk_type
              )

          # prepare_branding_assets field rules: name -> (max_w, max_h, max_bytes,
          # require_square, square_hint).  Kept exactly at the reviewed 1.4.9 gate.
          _STAGING_RULES = {
              # app-icon dimension rule lives in ONE layer: this prepare gate accepts any
              # square PNG up to 4096px (format/shape gate only); the build job's ICO
              # converter owns the final icon constraint (square, 16..256, with
              # nearest-neighbour downscale to 256 for larger provider icons).
              "app-icon.png": (
                  4096,
                  4096,
                  10 * 1024 * 1024,
                  True,
                  "must be square (used for exe/tray icon resources; larger square icons are downscaled to 256 px for the Windows ICO resources in the build job)",
              ),
              "app-logo.png": (4096, 4096, 10 * 1024 * 1024, False, ""),
              "privacy-screen.png": (
                  4096,
                  4096,
                  20 * 1024 * 1024,
                  False,
                  "(renders fullscreen while privacy mode is active)",
              ),
          }


          class PngError(Exception):
              """Raised when a branding PNG fails the shared validation contract."""


          class Png:
              """A validated, fully decoded 8-bit canonical PNG.

              The raster in :attr:`pixels` is always 8 bits per sample regardless of the source
              bit depth (a 16-bit sample keeps its most significant byte, a sub-byte sample is
              expanded, an indexed sample stays a palette index), and any Adam7 interlace has
              been expanded into the full raster.
              """

              __slots__ = ("width", "height", "color_type", "pixels", "plte", "trns", "transparency")

              def __init__(self, width, height, color_type, pixels, plte, trns, transparency=None):
                  self.width = width
                  self.height = height
                  self.color_type = color_type
                  self.pixels = pixels  # unfiltered 8-bit scanlines, filter byte removed
                  self.plte = plte
                  self.trns = trns
                  # Per-pixel alpha (0 or 255) for a greyscale/truecolour tRNS sample, decided
                  # at the source sample width; ``None`` when tRNS does not apply.
                  self.transparency = transparency

              def bgra(self):
                  """Return ``(BGRA bytes, width, height)``; > 256px is downscaled to 256."""
                  channels = _CHANNELS[self.color_type]
                  width = self.width
                  height = self.height
                  stride = width * channels
                  pixels = self.pixels
                  transparency = self.transparency
                  screen = bytearray(width * height * 4)
                  # tRNS names exactly one fully transparent sample: a 2-byte gray value
                  # (color type 0) or a 6-byte RGB value (color type 2); it was compared at
                  # the source sample width in load() and is precomputed into ``transparency``.
                  # Indexed transparency is the per-entry alpha table used below. The alpha
                  # color types (4/6) never carry tRNS (load() rejects it).
                  for y in range(height):
                      base = y * width * 4
                      row = pixels[y * stride:(y + 1) * stride]
                      for x in range(width):
                          sx = x * channels
                          dx = base + x * 4
                          if self.color_type == 6:
                              screen[dx], screen[dx + 1], screen[dx + 2], screen[dx + 3] = (
                                  row[sx + 2], row[sx + 1], row[sx], row[sx + 3],
                              )
                          elif self.color_type == 2:
                              alpha = transparency[y * width + x] if transparency is not None else 255
                              screen[dx], screen[dx + 1], screen[dx + 2], screen[dx + 3] = (
                                  row[sx + 2], row[sx + 1], row[sx], alpha,
                              )
                          elif self.color_type == 4:
                              screen[dx], screen[dx + 1], screen[dx + 2], screen[dx + 3] = (
                                  row[sx], row[sx], row[sx], row[sx + 1],
                              )
                          elif self.color_type == 0:
                              alpha = transparency[y * width + x] if transparency is not None else 255
                              screen[dx], screen[dx + 1], screen[dx + 2], screen[dx + 3] = (
                                  row[sx], row[sx], row[sx], alpha,
                              )
                          else:
                              index = row[sx]
                              if index * 3 + 2 >= len(self.plte):
                                  raise PngError("PNG palette index is out of range")
                              alpha = self.trns[index] if self.trns is not None and index < len(self.trns) else 255
                              screen[dx], screen[dx + 1], screen[dx + 2], screen[dx + 3] = (
                                  self.plte[index * 3 + 2],
                                  self.plte[index * 3 + 1],
                                  self.plte[index * 3],
                                  alpha,
                              )
                  if width > 256 or height > 256:
                      # exe resource icons must stay <= 256px: nearest-neighbour downscale.
                      target = 256
                      scaled = bytearray(target * target * 4)
                      for ty in range(target):
                          source_row = (ty * height // target) * width * 4
                          for tx in range(target):
                              source = source_row + (tx * width // target) * 4
                              dest = (ty * target + tx) * 4
                              scaled[dest:dest + 4] = screen[source:source + 4]
                      return bytes(scaled), target, target
                  return bytes(screen), width, height


          def _fail(message):
              raise PngError(message)


          def _unfilter_scanline(raw, offset, row_bytes, bpp, previous, label):
              """Undo one PNG scanline filter; return ``(unfiltered row, next offset)``.

              ``bpp`` is the filter byte stride (the pixel size in bytes, at least one), which
              is what makes packed sub-byte samples filter correctly. ``previous`` is the
              previously reconstructed scanline of the same interlace pass, or zeros.
              """
              ftype = raw[offset]
              row = bytearray(raw[offset + 1:offset + 1 + row_bytes])
              for i in range(row_bytes):
                  a_ = row[i - bpp] if i >= bpp else 0
                  b_ = previous[i]
                  c_ = previous[i - bpp] if i >= bpp else 0
                  if ftype == 1:
                      row[i] = (row[i] + a_) & 0xFF
                  elif ftype == 2:
                      row[i] = (row[i] + b_) & 0xFF
                  elif ftype == 3:
                      row[i] = (row[i] + (a_ + b_) // 2) & 0xFF
                  elif ftype == 4:
                      p_ = a_ + b_ - c_
                      pa, pb, pc = abs(p_ - a_), abs(p_ - b_), abs(p_ - c_)
                      pr = a_ if pa <= pb and pa <= pc else (b_ if pb <= pc else c_)
                      row[i] = (row[i] + pr) & 0xFF
                  elif ftype != 0:
                      _fail(label + " uses an unknown scanline filter")
              return row, offset + 1 + row_bytes


          def load(data, label="PNG", max_width=4096, max_height=4096, max_bytes=None,
                   require_square=False, square_hint=""):
              """Validate one branding PNG and return a decoded :class:`Png`.

              Raises :class:`PngError` for any structural, digest-independent defect.
              """
              if max_bytes is not None and len(data) > max_bytes:
                  _fail(label + " exceeds the byte cap (" + str(max_bytes) + ")")
              if len(data) < 33:
                  _fail(label + " is too small to be a PNG image")
              if data[:8] != PNG_SIGNATURE:
                  _fail(label + " is not a PNG image; provider image URLs must point to .png files")

              size = len(data)
              pos = 8
              count = 0
              ihdr = None
              chunks = []
              ended = False
              # Full structural walk of the chunk stream (fail on any truncation).
              while pos < size:
                  if ended:
                      _fail(label + " has data after IEND")
                  if size - pos < 8:
                      _fail(label + " ends inside a chunk header (truncated)")
                  (length,) = struct.unpack(">I", data[pos:pos + 4])
                  ctype = data[pos + 4:pos + 8]
                  if pos + 12 + length > size:
                      _fail(label + " chunk extends past its declared length (truncated)")
                  chunk = data[pos + 8:pos + 8 + length]
                  (crc,) = struct.unpack(">I", data[pos + 8 + length:pos + 12 + length])
                  if (zlib.crc32(ctype + chunk) & 0xFFFFFFFF) != crc:
                      _fail(label + " chunk CRC mismatch")
                  if count == 0 and ctype != b"IHDR":
                      _fail(label + " first chunk is not IHDR")
                  if ctype == b"IHDR":
                      if count != 0 or ihdr is not None:
                          _fail(label + " has an invalid IHDR placement")
                      ihdr = chunk
                  elif ctype == b"IEND":
                      if length != 0:
                          _fail(label + " has a malformed IEND chunk")
                      ended = True
                  chunks.append((ctype, chunk))
                  pos += 12 + length
                  count += 1

              if not ended:
                  _fail(label + " is truncated (no IEND chunk)")
              if ihdr is None or len(ihdr) != 13:
                  _fail(label + " has an unreadable IHDR chunk")
              width, height, depth, color_type, compression, filter_method, interlace = struct.unpack(
                  ">IIBBBBB", ihdr
              )
              if width == 0 or height == 0:
                  _fail(label + " has a zero dimension")
              if compression != 0 or filter_method != 0:
                  _fail(label + " uses unsupported compression/filter method flags")
              if interlace not in (0, 1):
                  _fail(
                      label + " uses unsupported PNG interlace method " + str(interlace)
                      + " (only non-interlaced or Adam7 interlaced PNG is supported)"
                  )
              channels = _CHANNELS.get(color_type)
              if channels is None:
                  _fail(label + " uses unsupported PNG color type " + str(color_type))
              if depth not in _DEPTHS[color_type]:
                  _fail(
                      label + " uses a PNG bit depth " + str(depth) + " that is invalid for color type "
                      + str(color_type) + " (allowed: "
                      + "/".join(str(value) for value in _DEPTHS[color_type]) + ")"
                  )
              if not 1 <= width <= max_width or not 1 <= height <= max_height:
                  _fail(
                      label + " has out-of-range dimensions " + str(width) + "x" + str(height)
                      + " (max " + str(max_width) + "x" + str(max_height) + ")"
                  )
              if require_square and width != height:
                  _fail(label + " " + square_hint if square_hint else label + " must be square")
              # Chunk-order and chunk-type rules (PNG 1.2 sections 3.3 / 4.1.2 / 5.3 / 5.6).
              # A structurally whole stream is not necessarily a decodable one: every chunk
              # type must be four ASCII letters, PLTE must precede the first IDAT and appear
              # at most once, tRNS must precede the first IDAT, follow PLTE for indexed
              # colour, and appear at most once, the IDAT chunks must be consecutive, and an
              # unknown critical chunk must never be silently ignored.
              plte = None
              trns = None
              idat_parts = []
              saw_idat = False
              previous_type = b"IHDR"
              for chunk_type, chunk in chunks:
                  if not _valid_chunk_type(chunk_type):
                      _fail(label + " has a malformed chunk type " + chunk_type.decode("latin-1"))
                  if chunk_type == b"PLTE":
                      if plte is not None:
                          _fail(label + " has more than one PLTE chunk")
                      if saw_idat:
                          _fail(label + " has a PLTE chunk after the first IDAT")
                      plte = chunk
                  elif chunk_type == b"tRNS":
                      if trns is not None:
                          _fail(label + " has more than one tRNS chunk")
                      if saw_idat:
                          _fail(label + " has a tRNS chunk after the first IDAT")
                      if color_type == 3 and plte is None:
                          _fail(label + " has a tRNS chunk before its PLTE chunk")
                      trns = chunk
                  elif chunk_type == b"IDAT":
                      if saw_idat and previous_type != b"IDAT":
                          _fail(label + " has non-consecutive IDAT chunks")
                      saw_idat = True
                      idat_parts.append(chunk)
                  elif chunk_type in (b"IHDR", b"IEND"):
                      pass
                  elif chunk_type[0:1].isupper():
                      _fail(label + " contains an unknown critical chunk " + chunk_type.decode("latin-1"))
                  previous_type = chunk_type
              # PLTE is required exactly once for indexed colour (3). PNG 1.2 4.1.2 forbids
              # it for grayscale (0) and grayscale+alpha (4), but permits it for truecolour
              # (2) and truecolour+alpha (6) as a *suggested* palette that a decoder may
              # ignore -- the raster consumer does not use it for those types, so the
              # decoded output is unchanged. Whenever PLTE is present its structure must be
              # a valid palette (a multiple of three bytes, 1..256 entries).
              if plte is not None:
                  if color_type in (0, 4):
                      _fail(
                          label + " has a PLTE chunk but color type " + str(color_type)
                          + " forbids one (only indexed colour 3, or truecolour 2/6 as a"
                          " suggested palette, may carry PLTE)"
                      )
                  if len(plte) % 3 != 0 or not 1 <= len(plte) // 3 <= 256:
                      _fail(label + " has an invalid PLTE chunk")
              elif color_type == 3:
                  _fail(label + " palette PNG is missing its PLTE chunk")
              if trns is not None:
                  if color_type == 3:
                      if len(trns) > len(plte) // 3:
                          _fail(label + " tRNS chunk is longer than the palette")
                  elif color_type == 0:
                      if len(trns) != 2:
                          _fail(label + " grayscale tRNS chunk must be exactly 2 bytes")
                  elif color_type == 2:
                      if len(trns) != 6:
                          _fail(label + " truecolor tRNS chunk must be exactly 6 bytes")
                  else:
                      _fail(label + " alpha color type " + str(color_type) + " must not carry a tRNS chunk")
              if not saw_idat:
                  _fail(label + " has no image data")

              idat = b"".join(idat_parts)
              # Scanline layout: the non-interlaced image is one pass; otherwise the seven
              # Adam7 passes. Each pass is an independent reduced image with its own row width,
              # filter stride and previous scanline, and a pass with no columns carries no
              # scanlines at all (no filter byte) per PNG 1.2 8.2.
              passes = ((0, 0, 1, 1),) if interlace == 0 else _ADAM7_PASSES
              bpp = (channels * depth + 7) // 8
              layout = []
              expected = 0
              for xstart, ystart, xstep, ystep in passes:
                  pass_width = _pass_extent(width, xstart, xstep)
                  if pass_width == 0:
                      continue
                  pass_height = _pass_extent(height, ystart, ystep)
                  row_bytes = (pass_width * channels * depth + 7) // 8
                  expected += pass_height * (row_bytes + 1)
                  layout.append((pass_width, pass_height, row_bytes, xstart, ystart, xstep, ystep))
              # Bounded decompression: never ask zlib for more than one byte beyond the exact
              # scanline stream the IHDR and interlace layout imply, so a decompression bomb
              # cannot allocate meaningfully more than the declared image size.
              try:
                  decompressor = zlib.decompressobj()
                  raw = decompressor.decompress(idat, expected + 1)
              except zlib.error as exc:
                  _fail(label + " image data is corrupt: " + str(exc))
              if len(raw) > expected:
                  _fail(
                      label + " image data contains more scanline bytes than the IHDR dimensions"
                      " allow (extra or trailing pixel data)"
                  )
              if not decompressor.eof or decompressor.unconsumed_tail or decompressor.unused_data:
                  # unused_data is payload after the zlib end marker: a decoder must not accept
                  # a trailing byte stream once the compressed image data has ended.
                  _fail(label + " image data stream is incomplete or has trailing data")
              if len(raw) != expected:
                  _fail(label + " image data is incomplete (truncated)")

              # Canonical 8-bit raster: unfilter every scanline of every pass, expand packed
              # sub-byte samples, and keep the most significant byte of each 16-bit sample, so
              # every consumer sees one 8-bit channel layout regardless of the source format.
              stride = width * channels
              pixels = bytearray(height * stride)
              max_value = (1 << depth) - 1
              # tRNS on greyscale/truecolour names one fully transparent sample: a 2-byte gray
              # value (color type 0) or a 6-byte RGB value (color type 2). It is compared at the
              # source sample width, so a 16-bit value is not collapsed to its top byte before
              # the comparison. The alpha color types (4/6) never carry tRNS (rejected above).
              transparent_gray = None
              transparent_rgb = None
              if trns is not None and color_type == 0:
                  (transparent_gray,) = struct.unpack(">H", trns)
              elif trns is not None and color_type == 2:
                  transparent_rgb = struct.unpack(">HHH", trns)
              transparency = None
              if transparent_gray is not None or transparent_rgb is not None:
                  transparency = bytearray(b"\xff" * (width * height))
              offset = 0
              if interlace == 0 and depth == 8:
                  # Fast path: the unfiltered scanlines are already the canonical 8-bit raster
                  # (byte-identical to the original decoder).
                  previous = bytearray(stride)
                  for y in range(height):
                      row, offset = _unfilter_scanline(raw, offset, stride, channels, previous, label)
                      pixels[y * stride:(y + 1) * stride] = row
                      previous = row
                      if transparency is not None:
                          row_base = y * width
                          if color_type == 0:
                              for x in range(width):
                                  if row[x] == transparent_gray:
                                      transparency[row_base + x] = 0
                          else:
                              for x in range(width):
                                  sx = x * 3
                                  if (row[sx], row[sx + 1], row[sx + 2]) == transparent_rgb:
                                      transparency[row_base + x] = 0
              else:
                  for pass_width, pass_height, row_bytes, xstart, ystart, xstep, ystep in layout:
                      previous = bytearray(row_bytes)
                      for row_index in range(pass_height):
                          row, offset = _unfilter_scanline(raw, offset, row_bytes, bpp, previous, label)
                          previous = row
                          y = ystart + row_index * ystep
                          for column in range(pass_width):
                              x = xstart + column * xstep
                              destination = (y * width + x) * channels
                              if depth == 8:
                                  base = column * channels
                                  for channel in range(channels):
                                      pixels[destination + channel] = row[base + channel]
                                  if transparency is not None:
                                      if color_type == 0:
                                          if row[base] == transparent_gray:
                                              transparency[y * width + x] = 0
                                      elif (row[base], row[base + 1], row[base + 2]) == transparent_rgb:
                                          transparency[y * width + x] = 0
                              elif depth == 16:
                                  base = column * channels * 2
                                  if color_type == 0:
                                      if transparency is not None and ((row[base] << 8) | row[base + 1]) == transparent_gray:
                                          transparency[y * width + x] = 0
                                      pixels[destination] = row[base]
                                  elif color_type == 2:
                                      if transparency is not None:
                                          red = (row[base] << 8) | row[base + 1]
                                          green = (row[base + 2] << 8) | row[base + 3]
                                          blue = (row[base + 4] << 8) | row[base + 5]
                                          if (red, green, blue) == transparent_rgb:
                                              transparency[y * width + x] = 0
                                      pixels[destination] = row[base]
                                      pixels[destination + 1] = row[base + 2]
                                      pixels[destination + 2] = row[base + 4]
                                  elif color_type == 4:
                                      pixels[destination] = row[base]
                                      pixels[destination + 1] = row[base + 2]
                                  else:
                                      pixels[destination] = row[base]
                                      pixels[destination + 1] = row[base + 2]
                                      pixels[destination + 2] = row[base + 4]
                                      pixels[destination + 3] = row[base + 6]
                              else:
                                  # Packed 1/2/4-bit sample, MSB-first within each byte.
                                  bit = column * depth
                                  value = (row[bit >> 3] >> (8 - depth - (bit & 7))) & max_value
                                  if color_type == 0:
                                      # Greyscale scales to the full 8-bit range (PNG 1.2 13.12).
                                      pixels[destination] = value * (255 // max_value)
                                      if transparency is not None and value == transparent_gray:
                                          transparency[y * width + x] = 0
                                  else:
                                      # Indexed colour: the packed value is the palette index.
                                      pixels[destination] = value
              # Indexed colour: every decoded pixel must address a real palette entry, and a
              # tRNS alpha table may not be longer than the palette it decorates. The raster
              # consumer (Png.bgra) already rejects an out-of-range index, but load() is what
              # every declared-acceptable check (logo and privacy consumers use load()/the CLI
              # only) trusts, so the same range rule must hold here: a PNG the validator
              # accepts must actually be decodable by every consumer.
              if color_type == 3:
                  entries = len(plte) // 3
                  for index in pixels:
                      if index >= entries:
                          _fail(label + " contains a palette index that is out of range")
              return Png(width, height, color_type, bytes(pixels), plte, trns, transparency)


          def _png_chunk(chunk_type, payload):
              return (
                  struct.pack(">I", len(payload))
                  + chunk_type
                  + payload
                  + struct.pack(">I", zlib.crc32(chunk_type + payload) & 0xFFFFFFFF)
              )


          def _paeth(a, b, c):
              p = a + b - c
              pa = abs(p - a)
              pb = abs(p - b)
              pc = abs(p - c)
              if pa <= pb and pa <= pc:
                  return a
              if pb <= pc:
                  return b
              return c


          def _filter_row(row, previous, bpp, filter_type):
              filtered = bytearray(len(row))
              for i in range(len(row)):
                  a = row[i - bpp] if i >= bpp else 0
                  b = previous[i]
                  c = previous[i - bpp] if i >= bpp else 0
                  if filter_type == 1:
                      predictor = a
                  elif filter_type == 2:
                      predictor = b
                  elif filter_type == 3:
                      predictor = (a + b) // 2
                  elif filter_type == 4:
                      predictor = _paeth(a, b, c)
                  else:
                      predictor = 0
                  filtered[i] = (row[i] - predictor) & 0xFF
              return filtered


          def _filter_cost(filtered):
              # Minimum sum of absolute differences (libpng's default heuristic). It is a pure
              # function of the reconstructed raster, so re-encoding a canonical image reproduces
              # the same per-scanline filter choices and therefore the same bytes.
              return sum(value if value < 128 else 256 - value for value in filtered)


          def encode(image):
              """Re-encode a decoded :class:`Png` as a canonical 8-bit non-interlaced PNG.

              Emits only IHDR, IDAT and IEND with correct CRCs and one valid zlib stream, at
              colour type 2 (RGB) for a fully opaque raster or 6 (RGBA) when the source carried
              an alpha channel or a tRNS sample, so alpha is preserved. Dimensions are kept
              exactly. The result is deterministic and idempotent.
              """
              width = image.width
              height = image.height
              source_channels = _CHANNELS[image.color_type]
              source_stride = width * source_channels
              pixels = image.pixels
              transparency = image.transparency
              preserve_alpha = image.color_type in (4, 6) or image.trns is not None
              channels = 4 if preserve_alpha else 3
              stride = width * channels
              raster = bytearray(height * stride)
              for y in range(height):
                  source_base = y * source_stride
                  base = y * stride
                  row_base = y * width
                  for x in range(width):
                      sx = source_base + x * source_channels
                      dx = base + x * channels
                      if image.color_type == 6:
                          raster[dx:dx + 3] = pixels[sx:sx + 3]
                          raster[dx + 3] = pixels[sx + 3]
                      elif image.color_type == 2:
                          raster[dx:dx + 3] = pixels[sx:sx + 3]
                          if preserve_alpha:
                              raster[dx + 3] = transparency[row_base + x] if transparency is not None else 255
                      elif image.color_type == 4:
                          raster[dx] = pixels[sx]
                          raster[dx + 1] = pixels[sx]
                          raster[dx + 2] = pixels[sx]
                          raster[dx + 3] = pixels[sx + 1]
                      elif image.color_type == 0:
                          raster[dx] = pixels[sx]
                          raster[dx + 1] = pixels[sx]
                          raster[dx + 2] = pixels[sx]
                          if preserve_alpha:
                              raster[dx + 3] = transparency[row_base + x] if transparency is not None else 255
                      else:
                          index = pixels[sx]
                          raster[dx] = image.plte[index * 3]
                          raster[dx + 1] = image.plte[index * 3 + 1]
                          raster[dx + 2] = image.plte[index * 3 + 2]
                          if preserve_alpha:
                              raster[dx + 3] = image.trns[index] if image.trns is not None and index < len(image.trns) else 255
              raw = bytearray()
              previous = bytearray(stride)
              for y in range(height):
                  row = raster[y * stride:(y + 1) * stride]
                  best_type = 0
                  best = _filter_row(row, previous, channels, 0)
                  best_cost = _filter_cost(best)
                  for filter_type in range(1, 5):
                      candidate = _filter_row(row, previous, channels, filter_type)
                      cost = _filter_cost(candidate)
                      if cost < best_cost:
                          best_type = filter_type
                          best = candidate
                          best_cost = cost
                  raw.append(best_type)
                  raw.extend(best)
                  previous = row
              color_type = 6 if preserve_alpha else 2
              ihdr = struct.pack(">IIBBBBB", width, height, 8, color_type, 0, 0, 0)
              return (
                  PNG_SIGNATURE
                  + _png_chunk(b"IHDR", ihdr)
                  + _png_chunk(b"IDAT", zlib.compress(bytes(raw), 9))
                  + _png_chunk(b"IEND", b"")
              )


          # Upper bound on the byte size of ``encode(image)`` for a decoded image whose
          # geometry already passed the gates.  The canonical re-encode is an 8-bit
          # non-interlaced PNG whose only variable-length chunk is one IDAT payload produced
          # by ``zlib.compress(raw, 9)``: zlib guarantees that output is never larger than
          # ``compressBound(n)`` for an n-byte input, where n is the filter-byte-per-scanline
          # raster the geometry and canonical channel count imply.  The fixed overhead is the
          # 8-byte signature plus IHDR (12+13), IDAT framing (12) and IEND (12) -- 57 bytes --
          # and zlib's bound adds n + (n>>12) + (n>>14) + (n>>25) + 13.  This depends only on
          # the validated width/height and channel count, never on the download cap, so a
          # canonical re-encode of any accepted input always satisfies it; it exists solely so
          # an encoder bug fails closed here instead of shipping an oversized or malformed file.
          def canonical_byte_bound(image):
              channels = 4 if (image.color_type in (4, 6) or image.trns is not None) else 3
              raw = image.height * (1 + image.width * channels)
              return 57 + raw + (raw >> 12) + (raw >> 14) + (raw >> 25) + 13


          def prepare(staging):
              """Canonicalise every staged branding image and write branding_manifest.json."""
              staging = pathlib.Path(staging)
              prepared = []
              for name, (max_w, max_h, max_bytes, require_square, square_hint) in _STAGING_RULES.items():
                  path = staging / name
                  if not path.is_file():
                      continue
                  data = path.read_bytes()
                  try:
                      image = load(
                          data,
                          name,
                          max_width=max_w,
                          max_height=max_h,
                          max_bytes=max_bytes,
                          require_square=require_square,
                          square_hint=square_hint,
                      )
                  except PngError as exc:
                      print("::error::" + str(exc))
                      return 1
                  canonical = encode(image)
                  # Consumers receive the canonical re-encode, never the raw downloaded bytes, so a
                  # 16-bit or interlaced source cannot reach the build as-is. A locally generated
                  # canonical file is not a downloaded response, so the per-field download cap does
                  # not apply to it: an indexed source can legitimately re-encode to RGB bytes far
                  # larger than the fetch cap while still being a valid in-domain image. The
                  # canonical bytes are therefore re-validated against the geometry-derived bound
                  # (never the download cap) plus the same structural, decode, dimension and square
                  # gates, so an encoder bug fails closed without rejecting a valid input.
                  try:
                      load(
                          canonical,
                          name,
                          max_width=max_w,
                          max_height=max_h,
                          max_bytes=canonical_byte_bound(image),
                          require_square=require_square,
                          square_hint=square_hint,
                      )
                  except PngError as exc:
                      print("::error::" + name + " canonical re-encode failed validation: " + str(exc))
                      return 1
                  prepared.append((name, path, image, canonical))
              images = {}
              for name, path, image, canonical in prepared:
                  path.write_bytes(canonical)
                  images[name] = {
                      "sha256": hashlib.sha256(canonical).hexdigest(),
                      "bytes": len(canonical),
                      "width": image.width,
                      "height": image.height,
                  }
              if images:
                  (staging / "branding_manifest.json").write_text(
                      json.dumps({"images": images}), encoding="utf-8"
                  )
              print("branding assets staged: " + (", ".join(images) if images else "none"))
              return 0


          def main(argv):
              if not argv:
                  sys.stderr.write(
                      "usage: validate_branding_png.py <png-or-staging-dir>"
                      " [--label L] [--max-width N] [--max-height N] [--max-bytes N] [--require-square]\n"
                  )
                  return 2
              target = pathlib.Path(argv[0])
              label = None
              max_width = 4096
              max_height = 4096
              max_bytes = None
              require_square = False
              index = 1
              while index < len(argv):
                  option = argv[index]
                  if option == "--require-square":
                      require_square = True
                      index += 1
                      continue
                  if option in ("--label", "--max-width", "--max-height", "--max-bytes") and index + 1 < len(argv):
                      value = argv[index + 1]
                      if option == "--label":
                          label = value
                      elif option == "--max-width":
                          max_width = int(value)
                      elif option == "--max-height":
                          max_height = int(value)
                      else:
                          max_bytes = int(value)
                      index += 2
                      continue
                  sys.stderr.write("unknown argument: " + option + "\n")
                  return 2
              if target.is_dir():
                  return prepare(target)
              if not target.is_file():
                  print("::error::" + str(target) + " is missing")
                  return 1
              name = label or target.name
              try:
                  image = load(
                      target.read_bytes(),
                      name,
                      max_width=max_width,
                      max_height=max_height,
                      max_bytes=max_bytes,
                      require_square=require_square,
                  )
              except PngError as exc:
                  print("::error::" + str(exc))
                  return 1
              print(
                  name + " verified: structurally complete and decodable "
                  + str(image.width) + "x" + str(image.height)
              )
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY
          chmod 700 "$validator"

          # Per-field caps (DeskForge #80). The cap is bound during the transfer by
          # reading at most cap+1 bytes off the response stream, so an oversized body
          # is aborted at fetch and never reaches the manifest or any downstream
          # consumer. This does not rely on HTTP Content-Length and is independent of
          # the runner's curl version: curl --max-filesize only aborts an unknown-length
          # body from curl 8.4.0 on, while the ubuntu-22.04 runner ships curl 7.81.0,
          # where a chunked (or understated Content-Length) response would otherwise be
          # downloaded in full before any post-download check. The transfer is pinned to
          # HTTP(S) for both the initial request and any redirect, so an allowed https
          # provider URL cannot be followed to a non-HTTP scheme.
          fetch_branding_image() {
            local field="$1" url="$2" out="$3" cap="$4"
            if [ -z "$url" ]; then return 0; fi
            local part="${out}.part"
            rm -f -- "$part"
            # Stream the response through a bounded reader: at most cap+1 bytes are
            # read, so an oversized body is cut off at fetch time and curl stops with a
            # broken pipe as soon as the cap is passed. This is Content-Length
            # independent and works on the runner's curl 7.81.0 (see the note above).
            # --proto/--proto-redir keep both the initial request and redirects on
            # http(s) only, matching the absolute-http(s) URL gate above.
            local fetch_failed=0
            if ! curl -fsSL --retry 2 --retry-delay 2 --max-time 120 \
                --proto '=http,https' --proto-redir '=http,https' \
                --output - -- "$url" | head -c "$((cap + 1))" > "$part"; then
              fetch_failed=1
            fi
            local bytes
            bytes=$(wc -c < "$part")
            if [ "$bytes" -gt "$cap" ]; then
              rm -f -- "$part"
              echo "::error::$field image exceeds the per-field byte cap (${cap} bytes)"
              exit 1
            fi
            if [ "$fetch_failed" -ne 0 ]; then
              rm -f -- "$part"
              echo "::error::$field image fetch failed from the provider URL (absolute http(s) URL required; the runner cannot fetch relative URLs; the response must stay within the ${cap}-byte cap)"
              exit 1
            fi
            mv -- "$part" "$out"
          }
          fetch_branding_image app_icon_url "$RQS_APP_ICON_URL" "$staging/app-icon.png" $((10 * 1024 * 1024))
          fetch_branding_image app_logo_url "$RQS_APP_LOGO_URL" "$staging/app-logo.png" $((10 * 1024 * 1024))
          fetch_branding_image privacy_screen_url "$RQS_PRIVACY_SCREEN_URL" "$staging/privacy-screen.png" $((20 * 1024 * 1024))

          # Validate every staged image and write branding_manifest.json with the same
          # module that is shipped to the consumers.
          if ! python3 "$validator" "$staging"; then
            echo "::error::branding image sanity checks failed"
            exit 1
          fi
          cp -- "$validator" "$staging/validate_branding_png.py"

          if [ ! -f "$staging/branding_manifest.json" ]; then
            echo "no DeskForge branding images requested; skipping"
            exit 0
          fi
          {
            echo "branding_assets_artifact=deskforge-branding-assets"
            if [ -f "$staging/privacy-screen.png" ]; then
              echo "privacy_image_artifact=deskforge-branding-assets"
            else
              echo "privacy_image_artifact="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: 'Upload branded image assets'
        if: steps.fetch_branding.outputs.branding_assets_artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskforge-branding-assets
          path: ${{ runner.temp }}/deskforge-branding-assets
          if-no-files-found: error
          retention-days: 7

  topmost:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    needs: [bridge, prepare_branding_assets]
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
      # DeskForge #80: brand the privacy-mode overlay image inside WindowInjection
      # when DFP1 carries privacy_screen_url (artifact prepared by
      # prepare_branding_assets; empty when the payload field is absent).
      privacy-image-artifact: ${{ needs.prepare_branding_assets.outputs.privacy_image_artifact }}

  build:
    needs: [verify_workflow_identity, bridge, topmost, prepare_branding_assets]
    runs-on: windows-2022
    steps:
      # Resolve the authenticated DFP1 build config. The former open-input debug
      # fallback is historical/superseded. Output is env vars RQS_*, masked in logs.
      - name: 'Resolve authenticated build config'
        shell: bash
        env:
          ENC: ${{ inputs.enc_payload }}
          PAYLOAD_KEY: ${{ secrets.WORKFLOW_PAYLOAD_KEY }}
          OUTER_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXECUTION_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          RQS_PAYLOAD_MODE=encrypted
          if [ -z "${ENC:-}" ]; then
            echo "::error::manual/direct runs require an authenticated DFP1 payload; no build is permitted"
            exit 1
          fi
          if [ -z "${PAYLOAD_KEY:-}" ]; then
              echo "::error::enc_payload provided but secret WORKFLOW_PAYLOAD_KEY is not set in this repo"
              exit 1
            fi
            echo "Resolve mode: ENCRYPTED (enc_payload, len ${#ENC})"
            # DFP1 is authenticated encrypt-then-MAC; legacy/open envelopes are
            # intentionally rejected by the active build workflow.
            decrypt_payload() {
              local payload_dir magic material aes_key aes_iv ciphertext
              payload_dir=$(mktemp -d)
              magic=$(printf '%s' "$ENC" | base64 -d | dd bs=1 count=4 status=none)
              if [ "$magic" = "DFP1" ]; then
                ciphertext="$payload_dir/ciphertext"
                if ! material=$(PAYLOAD_KEY="$PAYLOAD_KEY" ENC="$ENC" python3 - "$ciphertext" <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import pathlib
          import sys

          raw = base64.b64decode(os.environ["ENC"], validate=True)
          if len(raw) <= 4 + 16 + 32:
              raise SystemExit("authenticated payload is truncated")
          ciphertext = raw[20:-32]
          if not ciphertext or len(ciphertext) % 16:
              raise SystemExit("authenticated payload ciphertext is invalid")
          derived = hashlib.pbkdf2_hmac("sha256", os.environ["PAYLOAD_KEY"].encode(), raw[4:20], 100000, 80)
          expected = hmac.new(derived[48:], raw[:-32], hashlib.sha256).digest()
          if not hmac.compare_digest(expected, raw[-32:]):
              raise SystemExit("authenticated payload integrity check failed")
          pathlib.Path(sys.argv[1]).write_bytes(ciphertext)
          print(derived[:32].hex())
          print(derived[32:48].hex())
          PY
                ); then
                  rm -rf "$payload_dir"
                  return 1
                fi
                aes_key=$(printf '%s\n' "$material" | sed -n '1p')
                aes_iv=$(printf '%s\n' "$material" | sed -n '2p')
                if ! openssl enc -d -aes-256-cbc -K "$aes_key" -iv "$aes_iv" -in "$ciphertext"; then
                  rm -rf "$payload_dir"
                  return 1
                fi
              else
                echo "::error::enc_payload must use the authenticated DFP1 envelope" >&2
                rm -rf "$payload_dir"
                return 1
              fi
              rm -rf "$payload_dir"
            }
            validate_authenticated_workflow_identity() {
              local decrypted="$1" inner_workflow_sha
              if ! printf '%s' "$decrypted" | jq -e 'type == "object" and (.workflow_sha | type == "string")' >/dev/null; then
                echo "::error::authenticated workflow_sha must be a string"
                exit 1
              fi
              inner_workflow_sha=$(printf '%s' "$decrypted" | jq -r '.workflow_sha')
              if [[ ! "$inner_workflow_sha" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
                echo "::error::authenticated workflow_sha must be a 40-64 character hexadecimal SHA"
                exit 1
              fi
              if [ "$inner_workflow_sha" != "$OUTER_WORKFLOW_SHA" ] || [ "$inner_workflow_sha" != "$EXECUTION_WORKFLOW_SHA" ]; then
                echo "::error::authenticated workflow_sha does not match outer workflow_sha and github.sha"
                exit 1
              fi
            }
            decrypted=$(decrypt_payload)
            validate_authenticated_workflow_identity "$decrypted"
            RQS_SERVER=$(printf '%s' "$decrypted" | jq -r '.server // ""')
            RQS_KEY=$(printf '%s' "$decrypted" | jq -r '.key // ""')
            RQS_APP=$(printf '%s' "$decrypted" | jq -r '.app_name // ""')
            RQS_CT=$(printf '%s' "$decrypted" | jq -r '.custom_txt // ""')
            RQS_VERSION=$(printf '%s' "$decrypted" | jq -r '.version // ""')
            RQS_SOURCE_SHA=$(printf '%s' "$decrypted" | jq -r '.source_sha // ""')
            RQS_WORKFLOW_REPO=$(printf '%s' "$decrypted" | jq -r '.workflow_repo // ""')
            RQS_RELEASE_REPO=$(printf '%s' "$decrypted" | jq -r '.release_repo // ""')
            RQS_RELEASE_ASSETS=$(printf '%s' "$decrypted" | jq -c '.release_assets // empty')
            # DeskForge DFP1 branding fields (DeskForge issue #80): optional snake_case
            # strings, present in the encrypted payload only when non-empty. Text fields
            # are applied by the anchored L3 branding step; the *_url image fields are
            # fetched by prepare_branding_assets and consumed as sha256-verifiable
            # artifacts. custom_txt still flows to custom_.txt unmodified (runtime
            # identity), so these keys never enter custom_.txt.
            RQS_COMPANY_NAME=$(printf '%s' "$decrypted" | jq -r '.company_name // ""')
            RQS_DOWNLOAD_URL=$(printf '%s' "$decrypted" | jq -r '.download_url // ""')
            RQS_WEBSITE_URL=$(printf '%s' "$decrypted" | jq -r '.website_url // ""')
            RQS_PRIVACY_POLICY_URL=$(printf '%s' "$decrypted" | jq -r '.privacy_policy_url // ""')
            RQS_APP_ICON_URL=$(printf '%s' "$decrypted" | jq -r '.app_icon_url // ""')
            RQS_APP_LOGO_URL=$(printf '%s' "$decrypted" | jq -r '.app_logo_url // ""')
            RQS_PRIVACY_SCREEN_URL=$(printf '%s' "$decrypted" | jq -r '.privacy_screen_url // ""')
            if ! printf '%s' "$decrypted" | jq -e '
              (.server == null or (.server | type == "string")) and
              (.key == null or (.key | type == "string")) and
              (.app_name == null or (.app_name | type == "string")) and
              (.custom_txt == null or (.custom_txt | type == "string")) and
              (.company_name == null or (.company_name | type == "string")) and
              (.download_url == null or (.download_url | type == "string")) and
              (.website_url == null or (.website_url | type == "string")) and
              (.privacy_policy_url == null or (.privacy_policy_url | type == "string")) and
              (.app_icon_url == null or (.app_icon_url | type == "string")) and
              (.app_logo_url == null or (.app_logo_url | type == "string")) and
              (.privacy_screen_url == null or (.privacy_screen_url | type == "string")) and
              (.version == null or (.version | type == "string")) and
              (.source_sha == null or (.source_sha | type == "string")) and
              (.release_repo == null or (.release_repo | type == "string")) and
              (.workflow_repo | type == "string")
            ' >/dev/null; then
              echo "::error::encrypted payload env-bound fields must be strings"
              exit 1
            fi
          if [ "${RQS_WORKFLOW_REPO,,}" != "${GITHUB_REPOSITORY,,}" ]; then
            echo "::error::authenticated workflow repository does not match this fork"
            exit 1
          fi

          reject_control_chars() {
            local field="$1" value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]] || LC_ALL=C printf '%s' "$value" | LC_ALL=C grep -q '[[:cntrl:]]'; then
              echo "::error::$field contains unsafe control characters"
              exit 1
            fi
          }
          normalize_public_key() {
            local value="$1"
            while [[ "$value" == *$'\r' || "$value" == *$'\n' ]]; do
              value="${value%?}"
            done
            printf '%s' "$value"
          }
          validate_public_key() {
            local value="$1"
            if ! PUBLIC_KEY="$value" python3 - <<'PY'
          import base64
          import os
          import re

          value = os.environ["PUBLIC_KEY"]
          if not re.fullmatch(r"[A-Za-z0-9+/]{43}=", value):
              raise SystemExit("public key must be padded standard base64")
          try:
              raw = base64.b64decode(value, validate=True)
          except ValueError as exc:
              raise SystemExit("public key is not valid standard base64") from exc
          if len(raw) != 32 or base64.b64encode(raw).decode("ascii") != value:
              raise SystemExit("public key must encode exactly 32 bytes canonically")
          PY
            then
              echo "::error::RustDesk public key must be canonical padded base64 for 32 bytes"
              exit 1
            fi
          }
          validate_version() {
            local value="$1" byte_length
            byte_length=$(LC_ALL=C printf '%s' "$value" | wc -c)
            if [ "$byte_length" -gt 32 ] || [[ ! "$value" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?$ ]]; then
              echo "::error::RQS_VERSION must be a strict semantic version"
              exit 1
            fi
          }
          validate_app_name() {
            local value="$1" byte_length
            reject_control_chars app_name "$value"
            byte_length=$(LC_ALL=C printf '%s' "$value" | wc -c)
            if [ -z "$value" ] || [ "$value" = "." ] || [ "$value" = ".." ] || [ "$byte_length" -gt 128 ]; then
              echo "::error::app_name must be a non-empty filename component of at most 128 bytes"
              exit 1
            fi
            if [[ "$value" == */* || "$value" == *\\* || "$value" == *'<'* || "$value" == *'>'* || "$value" == *:* || "$value" == *'"'* || "$value" == *'|'* || "$value" == *'?'* || "$value" == *'*'* ]]; then
                echo "::error::app_name contains unsafe filename characters"
                exit 1
            fi
            case "$value" in
              *.|*' ') echo "::error::app_name must not end in a dot or space"; exit 1 ;;
            esac
            if is_windows_reserved_device_name "$value"; then
              echo "::error::app_name uses a reserved Windows device name"
              exit 1
            fi
          }
          is_windows_reserved_device_name() {
            local value="$1" base
            base="${value%%.*}"
            while [[ "$base" == *" " || "$base" == *"." ]]; do
              base="${base%?}"
            done
            case "${base^^}" in
              CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9]) return 0 ;;
              *) return 1 ;;
            esac
          }
          write_github_env() {
            local name="$1" value="$2"
            reject_control_chars "$name" "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }
          if [ -n "$RQS_KEY" ]; then
            RQS_KEY=$(normalize_public_key "$RQS_KEY")
          fi
          for field_value in \
            "RQS_SERVER=$RQS_SERVER" \
            "RQS_KEY=$RQS_KEY" \
            "RQS_CUSTOM_TXT=$RQS_CT" \
            "RQS_VERSION=$RQS_VERSION" \
            "RQS_SOURCE_SHA=$RQS_SOURCE_SHA" \
            "RQS_WORKFLOW_REPO=$RQS_WORKFLOW_REPO" \
            "RQS_RELEASE_REPO=$RQS_RELEASE_REPO" \
            "RQS_RELEASE_ASSETS=$RQS_RELEASE_ASSETS" \
            "RQS_COMPANY_NAME=$RQS_COMPANY_NAME" \
            "RQS_DOWNLOAD_URL=$RQS_DOWNLOAD_URL" \
            "RQS_WEBSITE_URL=$RQS_WEBSITE_URL" \
            "RQS_PRIVACY_POLICY_URL=$RQS_PRIVACY_POLICY_URL" \
            "RQS_APP_ICON_URL=$RQS_APP_ICON_URL" \
            "RQS_APP_LOGO_URL=$RQS_APP_LOGO_URL" \
            "RQS_PRIVACY_SCREEN_URL=$RQS_PRIVACY_SCREEN_URL"; do
            field_name=${field_value%%=*}
            field_value=${field_value#*=}
            reject_control_chars "$field_name" "$field_value"
          done
          validate_app_name "$RQS_APP"
          if [ -n "$RQS_KEY" ]; then
            validate_public_key "$RQS_KEY"
          fi
          if [ -n "$RQS_VERSION" ]; then
            validate_version "$RQS_VERSION"
          fi
          # Branding URL scheme gate (DeskForge #80): only absolute http(s) URLs can be
          # fetched by this runner. Relative URLs (e.g. '/upload/...') are a provider
          # boundary, not a valid image location; they fail the build with a clear
          # message instead of being silently ignored.
          validate_branding_url() {
            local field="$1" value="$2"
            if [ -z "$value" ]; then return 0; fi
            case "$value" in
              http://*|https://*) ;;
              *)
                echo "::error::$field must be an absolute http(s) URL; relative URLs (for example '/upload/...') cannot be fetched by this workflow and fail the build"
                exit 1 ;;
            esac
            if printf '%s' "$value" | grep -q '[[:space:]]'; then
              echo "::error::$field contains whitespace characters"
              exit 1
            fi
          }
          if [ -n "$RQS_COMPANY_NAME" ]; then
            if [ "$(LC_ALL=C printf '%s' "$RQS_COMPANY_NAME" | wc -c)" -gt 256 ]; then
              echo "::error::company_name must be at most 256 bytes"
              exit 1
            fi
          fi
          for branding_item in \
            "RQS_DOWNLOAD_URL=$RQS_DOWNLOAD_URL" \
            "RQS_WEBSITE_URL=$RQS_WEBSITE_URL" \
            "RQS_PRIVACY_POLICY_URL=$RQS_PRIVACY_POLICY_URL" \
            "RQS_APP_ICON_URL=$RQS_APP_ICON_URL" \
            "RQS_APP_LOGO_URL=$RQS_APP_LOGO_URL" \
            "RQS_PRIVACY_SCREEN_URL=$RQS_PRIVACY_SCREEN_URL"; do
            validate_branding_url "${branding_item%%=*}" "${branding_item#*=}"
          done

          if ! printf '%s' "$decrypted" | jq -e '.source_sha | type == "string"' >/dev/null; then
              echo "::error::encrypted payload source_sha must be a string"
              exit 1
          fi
          if [ -z "$RQS_SOURCE_SHA" ]; then
              echo "::error::encrypted payload is missing source_sha"
              exit 1
          fi
          if ! printf '%s' "$RQS_SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40,64}$'; then
              echo "::error::encrypted payload source_sha must be a hexadecimal commit SHA"
              exit 1
          fi
          if [[ ! "$RQS_RELEASE_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
              echo "::error::encrypted payload release_repo is missing or malformed"
              exit 1
          fi
          release_owner=${RQS_RELEASE_REPO%%/*}
            release_name=${RQS_RELEASE_REPO#*/}
          if [ "$release_owner" = "." ] || [ "$release_owner" = ".." ] || [ "$release_name" = "." ] || [ "$release_name" = ".." ]; then
              echo "::error::encrypted payload release_repo contains an invalid path segment"
              exit 1
          fi
          if [ -z "$RQS_RELEASE_ASSETS" ] || ! printf '%s\n' "$RQS_RELEASE_ASSETS" | jq -e --argjson required '["windows-x64-release.zip", "usbmmidd_v2.zip", "rustdesk_printer_driver_v4-1.4.zip", "printer_driver_adapter.zip"]' '
              type == "array" and length == ($required | length)
              and ([.[].name] | sort) == ($required | sort)
              and ([.[].id] | unique | length) == ([.[].id] | length)
              and all(.[]; (.id | type == "number") and (.id == (.id | floor)) and (.id > 0)
                and (.name | type == "string")
                and (.digest | type == "string" and test("(?i)^sha256:[0-9a-f]{64}$")))
          ' >/dev/null; then
              echo "::error::encrypted payload release asset metadata is missing or malformed"
              exit 1
          fi

          # Маскируем чувствительные значения в логах ДО экспорта в $GITHUB_ENV.
          # add-mask распространяется на всё содержимое логов до конца job'a.
          for v in "$RQS_KEY" "$RQS_CT"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done

          write_github_env RQS_PAYLOAD_MODE "$RQS_PAYLOAD_MODE"
          write_github_env RQS_SERVER "$RQS_SERVER"
          write_github_env RQS_KEY "$RQS_KEY"
          write_github_env RQS_APP_NAME "$RQS_APP"
          # Keep password-bearing custom_.txt content out of GITHUB_ENV. The
          # exact source_sha checkout/integrity check below is the trusted-source
          # gate; this restrictive path is shared only to the packaging step.
          if [ -n "$RQS_CT" ]; then
            custom_txt_file="${RUNNER_TEMP}/rustdesk-custom-${GITHUB_RUN_ID:-local}.txt"
            if command -v cygpath >/dev/null 2>&1 && [[ "$custom_txt_file" == *:* ]]; then
              custom_txt_file=$(cygpath -u "$custom_txt_file")
            fi
            cleanup_custom_txt_on_failure() {
              status=$?
              if [ "$status" -ne 0 ]; then rm -f -- "$custom_txt_file"; fi
              trap - EXIT
              exit "$status"
            }
            trap cleanup_custom_txt_on_failure EXIT
            (umask 077; printf '%s' "$RQS_CT" > "$custom_txt_file")
            chmod 600 "$custom_txt_file"
            write_github_env RQS_CUSTOM_TXT_FILE "$custom_txt_file"
          else
            write_github_env RQS_CUSTOM_TXT_FILE ""
          fi
          write_github_env RQS_VERSION "$RQS_VERSION"
          write_github_env RQS_SOURCE_SHA "$RQS_SOURCE_SHA"
          write_github_env RQS_WORKFLOW_REPO "$RQS_WORKFLOW_REPO"
          write_github_env RQS_RELEASE_REPO "$RQS_RELEASE_REPO"
          write_github_env RQS_RELEASE_ASSETS "$RQS_RELEASE_ASSETS"
          write_github_env RQS_COMPANY_NAME "$RQS_COMPANY_NAME"
          write_github_env RQS_DOWNLOAD_URL "$RQS_DOWNLOAD_URL"
          write_github_env RQS_WEBSITE_URL "$RQS_WEBSITE_URL"
          write_github_env RQS_PRIVACY_POLICY_URL "$RQS_PRIVACY_POLICY_URL"
          write_github_env RQS_APP_ICON_URL "$RQS_APP_ICON_URL"
          write_github_env RQS_APP_LOGO_URL "$RQS_APP_LOGO_URL"
          write_github_env RQS_PRIVACY_SCREEN_URL "$RQS_PRIVACY_SCREEN_URL"

          # сводка (без значений): что задано, что пусто
          echo "config: server=$([ -n "$RQS_SERVER" ] && echo SET || echo empty)"
          echo "config: key=$([ -n "$RQS_KEY" ] && echo SET || echo empty)"
          echo "config: app_name=$([ -n "$RQS_APP" ] && echo SET || echo empty)"
          echo "config: custom_txt=$([ -n "$RQS_CT" ] && echo SET || echo empty)"
          echo "config: version=$([ -n "$RQS_VERSION" ] && echo "$RQS_VERSION" || echo empty)"
          echo "config: source_sha=SET"
          echo "config: release_repo=$([ -n "$RQS_RELEASE_REPO" ] && echo SET || echo empty)"
          echo "config: company_name=$([ -n "$RQS_COMPANY_NAME" ] && echo SET || echo empty)"
          echo "config: download_url=$([ -n "$RQS_DOWNLOAD_URL" ] && echo SET || echo empty)"
          echo "config: website_url=$([ -n "$RQS_WEBSITE_URL" ] && echo SET || echo empty)"
          echo "config: privacy_policy_url=$([ -n "$RQS_PRIVACY_POLICY_URL" ] && echo SET || echo empty)"
          echo "config: app_icon_url=$([ -n "$RQS_APP_ICON_URL" ] && echo SET || echo empty)"
          echo "config: app_logo_url=$([ -n "$RQS_APP_LOGO_URL" ] && echo SET || echo empty)"
          echo "config: privacy_screen_url=$([ -n "$RQS_PRIVACY_SCREEN_URL" ] && echo SET || echo empty)"

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Preserve workflow manifest helper
        shell: bash
        run: |
          set -euo pipefail
          source_helper=.github/scripts/write_artifact_manifest.py
          helper_path="${RUNNER_TEMP}/deskforge-write_artifact_manifest.py"
          if command -v cygpath >/dev/null 2>&1 && [[ "$helper_path" == *:* ]]; then
            helper_path=$(cygpath -u "$helper_path")
          fi
          test -f "$source_helper" || { echo "::error::workflow-owned manifest helper is missing"; exit 1; }
          cp -- "$source_helper" "$helper_path"
          chmod 700 "$helper_path"
          printf 'MANIFEST_HELPER_PATH=%s\n' "$helper_path" >> "$GITHUB_ENV"

      # libs/portable is a root-workspace member whose build harness is
      # workflow-owned: requirements.txt pins brotli with hashes (so the L4
      # `pip3 install --require-hashes` succeeds), generate.py is the
      # SOURCE_DATE_EPOCH-deterministic revision, and build.rs declares
      # `rerun-if-changed=app_metadata.toml`. "Checkout source commit" replaces
      # the whole tree with the target source_sha, whose libs/portable may carry
      # the bare upstream versions instead (e.g. a bare `brotli` requirement,
      # which fails --require-hashes). Preserve the workflow-vendored copies
      # before that checkout so L4 always builds the reviewed harness.
      - name: Preserve portable harness inputs
        shell: bash
        run: |
          set -euo pipefail
          preserve_dir="${RUNNER_TEMP}/deskforge-portable-harness"
          if command -v cygpath >/dev/null 2>&1 && [[ "$preserve_dir" == *:* ]]; then
            preserve_dir=$(cygpath -u "$preserve_dir")
          fi
          mkdir -p "$preserve_dir"
          for rel in libs/portable/requirements.txt libs/portable/generate.py libs/portable/build.rs; do
            test -f "$rel" || { echo "::error::workflow-owned portable harness file is missing: $rel"; exit 1; }
            cp -- "$rel" "$preserve_dir/$(basename "$rel")"
          done
          requirements_path="$preserve_dir/requirements.txt"
          generate_path="$preserve_dir/generate.py"
          build_rs_path="$preserve_dir/build.rs"
          for preserved in "$requirements_path" "$generate_path" "$build_rs_path"; do
            test -f "$preserved" || { echo "::error::portable harness preserve failed: $preserved"; exit 1; }
          done
          printf 'PORTABLE_REQUIREMENTS_PATH=%s\n' "$requirements_path" >> "$GITHUB_ENV"
          printf 'PORTABLE_GENERATE_PATH=%s\n' "$generate_path" >> "$GITHUB_ENV"
          printf 'PORTABLE_BUILD_RS_PATH=%s\n' "$build_rs_path" >> "$GITHUB_ENV"

      - name: Checkout source commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RQS_SOURCE_SHA:-}" ]; then
            echo "::error::authenticated payload source_sha is required"
            exit 1
          fi
          if ! printf '%s' "$RQS_SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40,64}$'; then
            echo "::error::source_sha must be a hexadecimal commit SHA"
            exit 1
          fi
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "${{ github.token }}" | base64 | tr -d '\n\r')" \
            git fetch --no-tags --depth=1 origin "$RQS_SOURCE_SHA"
          git checkout --detach "$RQS_SOURCE_SHA"
          git submodule sync --recursive
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "${{ github.token }}" | base64 | tr -d '\n\r')" \
            git submodule update --init --recursive
          expected=$(printf '%s' "$RQS_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')
           actual=$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')
           [ "$actual" = "$expected" ] || { echo "::error::source checkout SHA mismatch"; exit 1; }

      - name: Set deterministic source timestamp
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]] || { echo "::error::invalid commit timestamp"; exit 1; }
          printf 'SOURCE_DATE_EPOCH=%s\n' "$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      # Override VERSION from encrypted payload (takes precedence over workflow-level default).
      - name: 'Override VERSION from dispatch payload'
        if: env.RQS_VERSION != ''
        shell: bash
        run: |
          if [ "${#RQS_VERSION}" -gt 32 ] || [[ ! "$RQS_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?$ ]]; then
            echo "::error::RQS_VERSION must be a strict semantic version"
            exit 1
          fi
          printf '%s=%s\n' VERSION "$RQS_VERSION" >> "$GITHUB_ENV"
          echo "VERSION overridden from dispatch: $RQS_VERSION"

      # L1: вшить сервер+ключ в config.rs ДО любой сборки. Опционально.
      - name: 'L1 inject: server + key into hbb_common/config.rs'
        if: env.RQS_SERVER != '' || env.RQS_KEY != ''
        shell: bash
        run: |
          set -eu
          f=libs/hbb_common/src/config.rs
          if [ -n "${RQS_SERVER:-}" ]; then
            echo "L1: server -> (masked)"
            esc=$(printf '%s' "$RQS_SERVER" | sed -e 's/[\/&]/\\&/g')
            sed -i "s/rs-ny\.rustdesk\.com/${esc}/" "$f"
            grep -F -q -- "$RQS_SERVER" "$f" || { echo "L1: server marker not found after sed"; exit 1; }
          fi
          if [ -n "${RQS_KEY:-}" ]; then
            echo "L1: key embedded (len ${#RQS_KEY})"
            esc=$(printf '%s' "$RQS_KEY" | sed -e 's/[\/&]/\\&/g')
            sed -i "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${esc}|" "$f"
            grep -F -q -- "$RQS_KEY" "$f" || { echo "L1: key marker not found after sed"; exit 1; }
          fi

      # L2 step A (PRE-BUILD): allowCustom — снять проверку подписи custom.txt + переименовать на custom_.txt
      - name: 'L2 patch: allowCustom (remove signature check, custom.txt → custom_.txt)'
        if: env.RQS_CUSTOM_TXT_FILE != ''
        shell: bash
        run: |
          set -eu
          python3 .github/patches/rdgen-allowCustom.py
          if grep -q '5Qbwsde3unUcJBtrx9ZkvUmwFNoExHzpryHuPUdqlWM=' src/common.rs; then
            echo "L2: allowCustom FAILED — signature key still present"; exit 1
          fi
          echo "L2: allowCustom applied (src/common.rs patched)"
          grep -c 'custom_\.txt' src/common.rs || true

      # L3 brand: rename RustDesk → app_name (sed по тем же файлам что rdgen + flutter CMakeLists)
      - name: 'L3 brand: rename RustDesk → app_name'
        if: env.RQS_APP_NAME != ''
        shell: bash
        run: |
          set -eu
          APP="$RQS_APP_NAME"
          esc=$(printf '%s' "$APP" | sed -e 's/[\/&]/\\&/g')

          for f in Cargo.toml libs/portable/Cargo.toml; do
            sed -i -e "s|description = \"RustDesk Remote Desktop\"|description = \"${esc}\"|" \
                   -e "s|ProductName = \"RustDesk\"|ProductName = \"${esc}\"|" \
                   -e "s|FileDescription = \"RustDesk Remote Desktop\"|FileDescription = \"${esc}\"|" \
                   -e "s|OriginalFilename = \"rustdesk.exe\"|OriginalFilename = \"${esc}.exe\"|" "$f"
          done

          sed -i -e "s|const APP_PREFIX: \&str = \"rustdesk\";|const APP_PREFIX: \&str = \"${esc}\";|" libs/portable/src/main.rs

          sed -i -e "s|\"RustDesk Remote Desktop\"|\"${esc}\"|" \
                 -e "s|VALUE \"InternalName\", \"rustdesk\" \"\\\\0\"|VALUE \"InternalName\", \"${esc}\" \"\\\\0\"|" \
                 -e "s|\"rustdesk.exe\"|\"${esc}.exe\"|" \
                 -e "s|\"RustDesk\"|\"${esc}\"|" flutter/windows/runner/Runner.rc

          # ВАЖНО: НЕ менять BINARY_NAME в flutter/windows/CMakeLists.txt!
          # libs/portable/generate.py hard-coded ищет внутри Release/ файл с именем
          # `rustdesk.exe` (см. вызов в build.py). Если переименовать — packer не найдёт
          # exe и build упадёт. Метаданные (ProductName/FileDescription/etc) уже
          # установлены через sed Runner.rc/Cargo.toml выше — этого достаточно для
          # отображения "rustqs" в свойствах файла. Финальный self-extract single-exe
          # переименовывается в "${appname}.exe" уже после packer'a (см. Portable-pack).
          echo "L3: brand → ${APP} (BINARY_NAME left as 'rustdesk' for packer)"

      # DeskForge #80 branding images: restore the sha256-manifested artifact
      # prepared by prepare_branding_assets and apply icon/logo assets to the
      # 1.4.9 anchor slots (in-app icon/logo, runner + packer + tray ICOs).
      - name: 'Restore branded image assets'
        if: needs.prepare_branding_assets.outputs.branding_assets_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deskforge-branding-assets
          path: ${{ runner.temp }}/deskforge-branding-assets

      # L3 brand (DeskForge #80): DFP1 payload keys company_name / download_url /
      # website_url / privacy_policy_url, each applied ONLY when non-empty.
      # Every replacement is anchored to the exact 1.4.9 source literals scoped to
      # the file being branded; a missing or already-changed anchor aborts the build
      # (fail-on-mismatch — no silent skips). Ordinary safe punctuation is supported
      # by escaping the value for each concrete insertion syntax: Windows .rc values
      # (backslash doubled, embedded quote written as a doubled quote), TOML basic
      # strings (backslash doubled, embedded quote backslash-escaped), and
      # interpolated Dart single-quoted literals (backslash, single quote and '$'
      # escaped). Control characters are still rejected,
      # so a value can never escape the literal it is inserted into. License/
      # attribution text (res/msi License.rtf, code headers) is deliberately NOT
      # touched.
      - name: 'L3 brand: company name + branded About links'
        if: env.RQS_COMPANY_NAME != '' || env.RQS_DOWNLOAD_URL != '' || env.RQS_WEBSITE_URL != '' || env.RQS_PRIVACY_POLICY_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys

          def fail(message):
              print("::error::" + message)
              raise SystemExit(1)

          def validated(field, raw, max_bytes):
              if not raw:
                  return None
              if any(ord(c) < 0x20 or ord(c) == 0x7F for c in raw):
                  fail(field + " contains control characters")
              if len(raw.encode("utf-8")) > max_bytes:
                  fail(field + " exceeds " + str(max_bytes) + " bytes")
              return raw

          def escape_rc(value):
              # Windows .rc double-quoted values: a backslash is doubled, but an
              # embedded double quote is written as a doubled quote `""` because RC
              # has no backslash quote escape (rc.exe/windres read \" literally). The
              # 1.4.9 source already relies on this, e.g. Runner.rc's
              # "#include ""winres.h""".
              return value.replace("\\", "\\\\").replace('"', '""')

          def escape_toml(value):
              # TOML basic strings: a backslash is doubled and a double-quote is
              # escaped with a backslash so the value cannot terminate the string
              # literal it is inserted into.
              return value.replace("\\", "\\\\").replace('"', '\\"')

          def escape_dart(value):
              # Dart single-quoted literals are interpolated: a backslash and a single
              # quote are escaped and '$' is escaped so it cannot start an
              # interpolation expression.
              return value.replace("\\", "\\\\").replace("'", "\\'").replace("$", "\\$")

          company = validated("company_name", os.environ.get("RQS_COMPANY_NAME", ""), 256)
          download = validated("download_url", os.environ.get("RQS_DOWNLOAD_URL", ""), 2048)
          website = validated("website_url", os.environ.get("RQS_WEBSITE_URL", ""), 2048)
          privacy = validated("privacy_policy_url", os.environ.get("RQS_PRIVACY_POLICY_URL", ""), 2048)

          # company_name is inserted into double-quoted Windows .rc literals, into
          # TOML basic strings, AND into an interpolated Dart single-quoted literal,
          # so keep one escaped form per concrete insertion syntax.
          companyRcQuoted = escape_rc(company) if company else None
          companyTomlQuoted = escape_toml(company) if company else None
          companyDart = escape_dart(company) if company else None
          downloadDart = escape_dart(download) if download else None
          websiteDart = escape_dart(website) if website else None
          privacyDart = escape_dart(privacy) if privacy else None
          companyCopyright = ("Copyright © 2026 " + companyRcQuoted + ". All rights reserved.").encode("utf-8") if company else None
          companyCargoCopyright = ('LegalCopyright = "Copyright © 2026 ' + companyTomlQuoted + '. All rights reserved."').encode("utf-8") if company else None
          companyRcName = ('VALUE "CompanyName", "' + companyRcQuoted + '" "\\0"').encode("utf-8") if company else None
          companyCargoAnchor = 'LegalCopyright = "Copyright © 2026 Purslane Tech Pte. Ltd. All rights reserved."'.encode("utf-8")

          ANCHORS = {
              "company_runrc_name": ('flutter/windows/runner/Runner.rc', b'VALUE "CompanyName", "Purslane Tech Pte. Ltd." "\\0"', companyRcName),
              "company_runrc_copyright": ('flutter/windows/runner/Runner.rc', 'Copyright © 2026 Purslane Tech Pte. Ltd. All rights reserved.'.encode("utf-8"), companyCopyright),
              "company_cargo": ("Cargo.toml", companyCargoAnchor, companyCargoCopyright),
              "company_packercargo": ("libs/portable/Cargo.toml", companyCargoAnchor, companyCargoCopyright),
              "company_about_dart": ("flutter/lib/desktop/pages/desktop_setting_page.dart", 'Purslane Tech Pte. Ltd.'.encode("utf-8"), companyDart.encode("utf-8") if company else None),
              "download_desktop": ("flutter/lib/desktop/pages/desktop_home_page.dart", b"'https://rustdesk.com/download'", ("'" + downloadDart + "'").encode("utf-8") if download else None),
              "download_mobile": ("flutter/lib/mobile/pages/connection_page.dart", b"'https://rustdesk.com/download'", ("'" + downloadDart + "'").encode("utf-8") if download else None),
              "website_about": ("flutter/lib/desktop/pages/desktop_setting_page.dart", b"launchUrlString('https://rustdesk.com');", ("launchUrlString('" + websiteDart + "');").encode("utf-8") if website else None),
              "website_powered": ("flutter/lib/common.dart", b"launchUrl(Uri.parse('https://rustdesk.com'));", ("launchUrl(Uri.parse('" + websiteDart + "'));").encode("utf-8") if website else None),
              "website_mobile": ("flutter/lib/mobile/pages/settings_page.dart", b"const url = 'https://rustdesk.com/';", ("const url = '" + websiteDart + "';").encode("utf-8") if website else None),
              "privacy_about": ("flutter/lib/desktop/pages/desktop_setting_page.dart", b"'https://rustdesk.com/privacy.html'", ("'" + privacyDart + "'").encode("utf-8") if privacy else None),
              "privacy_install": ("flutter/lib/desktop/pages/install_page.dart", b"'https://rustdesk.com/privacy.html'", ("'" + privacyDart + "'").encode("utf-8") if privacy else None),
              "privacy_mobile": ("flutter/lib/mobile/pages/settings_page.dart", b"'https://rustdesk.com/privacy.html'", ("'" + privacyDart + "'").encode("utf-8") if privacy else None),
          }
          EXPECTED_COUNTS = {
              "company_runrc_name": 1,
              "company_runrc_copyright": 1,
              "company_cargo": 1,
              "company_packercargo": 1,
              "company_about_dart": 1,
              "download_desktop": 1,
              "download_mobile": 1,
              "website_about": 1,
              "website_powered": 1,
              "website_mobile": 2,
              "privacy_about": 1,
              "privacy_install": 2,
              "privacy_mobile": 1,
          }

          pending = {key: ANCHORS[key] for key in ANCHORS if ANCHORS[key][2] is not None}
          if not pending:
              fail("branding step ran without any branding value to apply")

          # Phase 1: verify every anchor on the checked-out source before mutating
          # anything (fail-on-mismatch, no silent skips). Anchors are single-line,
          # byte-exact and pairwise disjoint, so per-file edit order is irrelevant.
          data_by_path = {}
          for key, (path, anchor, _replacement) in pending.items():
              try:
                  with open(path, "rb") as handle:
                      data = handle.read()
              except OSError as exc:
                  fail(key + ": cannot read " + path + ": " + str(exc))
              expected = EXPECTED_COUNTS[key]
              if data.count(anchor) != expected:
                  fail(
                      key + ": anchor mismatch in " + path
                      + ": expected " + str(expected) + " occurrence(s) of the 1.4.9 anchor;"
                      + " the client source changed since the anchored branding table was written; build aborted"
                  )
              data_by_path[path] = data
          # Phase 2: apply all verified replacements against the immutable Phase 1
          # snapshot. Every anchor occurrence is located by scanning that snapshot
          # once per key, so each original occurrence is replaced exactly once and a
          # replacement that itself contains or introduces a sibling anchor's bytes
          # is never re-scanned: it cannot be double-replaced nor trip a sibling
          # key's count guard (for example privacy_policy_url = https://rustdesk.com
          # rewrites the about-page privacy line into the website anchor text, which
          # is a legitimate DeskForge configuration). Anchors are single-line,
          # byte-exact and pairwise disjoint in the snapshot, so their spans never
          # overlap; an overlap is treated as source drift and aborts the build.
          spans_by_path = {}
          for key, (path, anchor, replacement) in pending.items():
              data = data_by_path[path]
              spans = []
              start = data.find(anchor)
              while start != -1:
                  spans.append((start, start + len(anchor), replacement))
                  start = data.find(anchor, start + len(anchor))
              if len(spans) != EXPECTED_COUNTS[key]:
                  fail(key + ": anchor count changed while applying " + path)
              spans_by_path.setdefault(path, []).extend(spans)
          expected_by_path = {}
          for path, spans in spans_by_path.items():
              data = data_by_path[path]
              spans.sort(key=lambda span: span[0])
              chunks = []
              cursor = 0
              for begin, end, replacement in spans:
                  if begin < cursor:
                      fail("overlapping branding anchors in " + path + "; build aborted")
                  chunks.append(data[cursor:begin])
                  chunks.append(replacement)
                  cursor = end
              chunks.append(data[cursor:])
              expected_by_path[path] = b"".join(chunks)
          # Phase 3: write each file once, then verify its on-disk bytes equal the exact
          # expected post-replacement content. This replaces the earlier
          # `anchor in data or replacement not in data` rule, which was not a sound
          # post-apply check: a legitimate replacement may itself contain the anchor
          # bytes (for example a company name that extends the 1.4.9 default literal), so
          # a correct apply still left the anchor present and aborted the build. Byte
          # equality accepts every legitimate replacement, including the anchor==
          # replacement no-op (whose expected content equals its source), while still
          # failing closed when a replacement did not land or post-apply drift changed
          # the file. Source drift is still caught by the Phase 1 anchor-count check.
          for path in sorted(expected_by_path):
              with open(path, "wb") as handle:
                  handle.write(expected_by_path[path])
          for key, (path, _anchor, _replacement) in sorted(pending.items()):
              with open(path, "rb") as handle:
                  data = handle.read()
              if data != expected_by_path[path]:
                  fail(key + ": post-apply verification failed for " + path)
              print("L3 brand: " + key + " applied to " + path)
          PY

      - name: 'L3 brand: apply branded icon + logo assets'
        if: needs.prepare_branding_assets.outputs.branding_assets_artifact != ''
        shell: bash
        env:
          BRANDED_ASSETS_DIR: ${{ runner.temp }}/deskforge-branding-assets
        run: |
          set -euo pipefail
          python3 - "$BRANDED_ASSETS_DIR" <<'PY'
          import hashlib
          import importlib.util
          import json
          import pathlib
          import struct
          import sys

          assets_dir = pathlib.Path(sys.argv[1])

          def fail(message):
              print("::error::" + message)
              raise SystemExit(1)

          # Shared branding PNG validator: prepared once by the
          # prepare_branding_assets job and shipped inside this same artifact,
          # so the icon/logo consumers run byte-identical validation code.
          validator_path = assets_dir / "validate_branding_png.py"
          if not validator_path.is_file():
              fail("branded assets artifact is missing the shared PNG validator (validate_branding_png.py)")
          spec = importlib.util.spec_from_file_location("deskforge_validate_branding_png", validator_path)
          if spec is None or spec.loader is None:
              fail("shared PNG validator cannot be loaded from the branded assets artifact")
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)

          manifest_path = assets_dir / "branding_manifest.json"
          if not manifest_path.is_file():
              fail("branded assets artifact is missing branding_manifest.json")
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))["images"]
          except Exception as exc:
              fail("branded assets manifest is not readable: " + str(exc))

          def source_bytes(name):
              path = assets_dir / name
              if not path.is_file():
                  fail("branded asset '" + name + "' is missing from the deskforge-branding-assets artifact")
              data = path.read_bytes()
              want = manifest.get(name, {}).get("sha256")
              if not want or hashlib.sha256(data).hexdigest() != want:
                  fail("branded asset '" + name + "' digest does not match the prepared manifest")
              return data

          def check_anchor(path, anchor, expected):
              data = pathlib.Path(path).read_bytes()
              if data.count(anchor) != expected:
                  fail(
                      "anchor mismatch in " + path + ": expected "
                      + str(expected) + " occurrence(s); the client source does not carry the anchored 1.4.9 branding target; build aborted"
                  )

          def ico_probe(data, label):
              if len(data) < 22 or data[0:4] != b"\x00\x00\x01\x00" or data[4] < 1:
                  fail("cannot replace " + label + ": existing file is not a valid ICO")

          def png_to_ico(data, label):
              # The shared validator owns all structure/decompression checks and the
              # raster extraction; this build step only adds the ICO packaging.
              try:
                  image = validator.load(
                      data, label, max_width=4096, max_height=4096, max_bytes=10 * 1024 * 1024
                  )
                  bgra, width, height = image.bgra()
              except validator.PngError as exc:
                  fail(str(exc))
              if width != height or not 16 <= width <= 256:
                  fail(label + " must be square and between 16 and 256 px for the Windows icon resources (enforced for app_icon_url)")
              mask_stride = ((width + 31) // 32) * 4
              body = bytearray(40 + height * width * 4)
              struct.pack_into("<IiiHHIIiiII", body, 0, 40, width, height * 2, 1, 32, 0, height * (width * 4 + mask_stride), 0, 0, 0, 0)
              for y in range(height - 1, -1, -1):
                  base = height - 1 - y
                  body[40 + base * width * 4:40 + (base + 1) * width * 4] = bgra[y * width * 4:(y + 1) * width * 4]
              body += bytes(mask_stride * height)
              frame = bytes(body)
              ico = struct.pack("<HHH", 0, 1, 1)
              ico += struct.pack("<BBBBHHII", 0 if width == 256 else width, 0 if width == 256 else width, 0, 0, 1, 32, len(frame), 22)
              ico += frame
              return ico

          plans = []
          if "app-icon.png" in manifest:
              icon_png = source_bytes("app-icon.png")
              # 1.4.9 runtime anchor: loadIcon prefers assets/icon.png for the in-app and
              # Windows tray icon (src/tray.rs load_icon_from_asset).
              check_anchor("flutter/lib/common.dart", b"return Image.asset('assets/icon.png',", 1)
              # 1.4.9 exe icon consumers: runner resource + main binary + portable packer icon.
              check_anchor("flutter/windows/runner/Runner.rc", b"IDI_APP_ICON", 1)
              check_anchor("build.rs", b'res.set_icon("res/icon.ico")', 1)
              check_anchor("src/tray.rs", b'icon = include_bytes!("../res/tray-icon.ico");', 1)
              ico_targets = ("flutter/windows/runner/resources/app_icon.ico", "res/icon.ico", "res/tray-icon.ico")
              for target in ico_targets:
                  if not pathlib.Path(target).is_file():
                      fail("branded icon target anchor missing: " + target + " (expected present in the 1.4.9 client source)")
                  ico_probe(pathlib.Path(target).read_bytes(), target)
              branded_ico = png_to_ico(icon_png, "app-icon.png")
              plans.append(("flutter/assets/icon.png", icon_png))
              for target in ico_targets:
                  plans.append((target, branded_ico))
              print("app icon: assets/icon.png + exe/packer/tray icon resources prepared")
          if "app-logo.png" in manifest:
              logo_png = source_bytes("app-logo.png")
              # 1.4.9 runtime anchor: _Logo/loadLogo renders assets/logo.png (max 300x60)
              # on the desktop home page.
              check_anchor("flutter/lib/common.dart", b"const _kDefaultLogoAsset = 'assets/logo.png';", 1)
              # A digest match only proves the bytes are the ones we staged; run
              # the shared structural validator so a corrupt/truncated logo fails
              # here instead of being copied into the app assets.
              try:
                  validator.load(logo_png, "app-logo.png", max_width=4096, max_height=4096, max_bytes=10 * 1024 * 1024)
              except validator.PngError as exc:
                  fail(str(exc))
              plans.append(("flutter/assets/logo.png", logo_png))
              print("app logo: flutter/assets/logo.png prepared")
          for path, data in plans:
              p = pathlib.Path(path)
              if not p.parent.exists():
                  # The asset subtree must exist in the checked-out client source;
                  # creating directories here would hide a changed source layout.
                  fail("branded asset directory is missing: " + str(p.parent))
              p.write_bytes(data)
              print("branded: " + path + " (" + str(len(data)) + " bytes)")
          PY

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ${{ runner.temp }}/deskforge-bridge-artifact

      - name: Verify and restore bridge files
        shell: bash
        env:
          BRIDGE_ARTIFACT_DIR: ${{ runner.temp }}/deskforge-bridge-artifact
          BRIDGE_WORKFLOW_SHA: ${{ github.sha }}
          BRIDGE_WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test -f "${MANIFEST_HELPER_PATH:-}" || { echo "::error::preserved manifest helper is unavailable"; exit 1; }
          python3 "$MANIFEST_HELPER_PATH" \
            --verify-bridge --output "$BRIDGE_ARTIFACT_DIR" \
            --expected-source-sha "$RQS_SOURCE_SHA" \
            --expected-version "$RQS_VERSION" \
            --workflow-sha "$BRIDGE_WORKFLOW_SHA" --workflow-ref "$BRIDGE_WORKFLOW_REF"
          bridge_files=(
            flutter/ios/Runner/bridge_generated.h
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            src/bridge_generated.io.rs
            src/bridge_generated.rs
          )
          for file in "${bridge_files[@]}"; do
            mkdir -p "$(dirname "$file")"
            cp -- "$BRIDGE_ARTIFACT_DIR/$file" "$file"
            test -f "$file" || { echo "::error::restored bridge file is missing from source path: $file"; exit 1; }
          done

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@1a3da29f56261a1e1f937ec88f0856a9b8321d7e # v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify and download offline release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredNames = @(
           'windows-x64-release.zip',
           'usbmmidd_v2.zip',
           'rustdesk_printer_driver_v4-1.4.zip',
           'printer_driver_adapter.zip'
          )
          if ([string]::IsNullOrWhiteSpace($env:RQS_RELEASE_REPO) -or $env:RQS_RELEASE_REPO -notmatch '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$') {
            throw 'provider-derived release repository is missing or malformed'
          }
          $repoParts = $env:RQS_RELEASE_REPO.Split('/')
          if ($repoParts.Count -ne 2 -or $repoParts[0] -in @('.', '..') -or $repoParts[1] -in @('.', '..')) {
            throw 'provider-derived release repository contains an invalid path segment'
          }
          if ([string]::IsNullOrWhiteSpace($env:RQS_RELEASE_ASSETS)) {
           throw 'provider-derived release asset metadata is missing'
          }
          try {
            $releaseAssets = @($env:RQS_RELEASE_ASSETS | ConvertFrom-Json)
          } catch {
            throw "provider-derived release asset metadata is invalid: $($_.Exception.Message)"
          }
          if ($releaseAssets.Count -ne $requiredNames.Count) {
            throw "provider-derived release asset metadata must contain exactly $($requiredNames.Count) assets"
          }
          $expectedByName = @{}
          foreach ($requiredName in $requiredNames) {
            $matchingAssets = @($releaseAssets | Where-Object { $_.name -eq $requiredName })
            if ($matchingAssets.Count -ne 1) {
              throw "required release asset '$requiredName' is missing or ambiguous"
            }
            $expected = $matchingAssets[0]
            if ([int64]$expected.id -le 0 -or [string]::IsNullOrWhiteSpace([string]$expected.name) -or [string]$expected.digest -notmatch '(?i)^sha256:[0-9a-f]{64}$') {
              throw "required release asset '$requiredName' has invalid provider identity"
            }
            $expectedByName[$requiredName] = $expected
          }

          $apiHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $downloadHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/octet-stream'
          }
          function Download-VerifiedReleaseAsset([string]$name) {
            $expected = $expectedByName[$name]
            $assetURI = "https://api.github.com/repos/$($env:RQS_RELEASE_REPO)/releases/assets/$([int64]$expected.id)"
            $remote = Invoke-RestMethod -UseBasicParsing -Headers $apiHeaders -Uri $assetURI -Method Get -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 120
            if ([int64]$remote.id -ne [int64]$expected.id -or [string]$remote.name -cne $name -or [string]$remote.digest -ine [string]$expected.digest) {
              throw "provider release asset identity mismatch for '$name'"
            }
            $path = Join-Path (Get-Location) $name
            $null = Invoke-WebRequest -UseBasicParsing -Headers $downloadHeaders -Uri $assetURI -Method Get -OutFile $path -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 120
            $actualDigest = (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedDigest = ([string]$expected.digest).Substring(7).ToLowerInvariant()
            if ($actualDigest -cne $expectedDigest) {
              throw "SHA-256 mismatch for '$name'"
            }
            Write-Output "verified release asset: $name"
          }

          foreach ($requiredName in $requiredNames) {
            Download-VerifiedReleaseAsset $requiredName
          }

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* "$env:FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64-release/"

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "=== $f ==="; cat "$f"; done
            exit 1
          fi

      - name: Build rustdesk (Flutter Windows) + bring in native deps
        run: |
          # --skip-portable-pack: packer запускаем сами в отдельном шаге, чтобы
          # положить custom_.txt + native deps в Release/ ДО упаковки.
          # НЕ переименовываем Release/ → ./rustdesk — packer ищет именно по этому пути
          # (libs/portable/generate.py вызывается с -f ../../flutter/build/windows/x64/runner/Release/).
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          $RELEASE = "flutter/build/windows/x64/runner/Release"

           # usbmmidd_v2 — виртуальный дисплей. Из release ФОРКА (суверенно). → в Release/
           Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 "$RELEASE/"

           # Printer driver + adapter из release форка. → в Release/
           Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
           mkdir "$RELEASE/drivers"
           mv -Force .\rustdesk_printer_driver_v4-1.4 "$RELEASE/drivers/RustDeskPrinterDriver"
           Expand-Archive printer_driver_adapter.zip -DestinationPath .
           mv -Force .\printer_driver_adapter.dll "$RELEASE/"

      - name: Download RustDeskTempTopMostWindow artifacts (→ Release/)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./flutter/build/windows/x64/runner/Release"

      # L2-B: положить custom_.txt в Release/ ДО запуска packer'a, чтобы он
      # попал ВНУТРЬ single-exe. После self-extract клиента, custom_.txt будет лежать
      # рядом с rustdesk.exe в TEMP-папке (там его и читает read_custom_client).
      - name: 'L2 payload: place custom_.txt into Release/ (will be packed inside exe)'
        if: env.RQS_CUSTOM_TXT_FILE != ''
        shell: bash
        run: |
          set -eu
          dst=flutter/build/windows/x64/runner/Release/custom_.txt
          trap 'rm -f -- "$RQS_CUSTOM_TXT_FILE"' EXIT
          cp -- "$RQS_CUSTOM_TXT_FILE" "$dst"
          ls -la "$dst"
          echo "L2: custom_.txt placed inside Release/ (size $(wc -c < "$dst"))"

      # L4: portable-pack (single self-extracting exe).
      # generate.py сжимает ВСЁ из -f папки в data.bin → embedded в Rust packer-binary.
       # Финал: libs/portable/target/release/rustdesk-portable-packer.exe (~30 MB). Переименуем в
      # {appname}.exe и положим в ./output/ для upload-artifact.
      - name: 'L4 portable-pack: build single-binary self-extracting exe'
        shell: bash
        run: |
          set -eu
          APP="$RQS_APP_NAME"
          ls flutter/build/windows/x64/runner/Release/ | head
          # Restore the workflow-owned portable build harness that "Preserve
          # portable harness inputs" saved before the source checkout. Copying
          # the preserved copies back into libs/portable/ is the single
          # mechanism that makes all three consumers see the reviewed harness:
          # the explicit pip install and generate.py below, plus the nested
          # `cargo build --locked --release` that generate.py runs (cargo reads
          # build.rs from the source tree, not from RUNNER_TEMP).
          test -f "${PORTABLE_REQUIREMENTS_PATH:-}" || { echo "::error::preserved portable requirements.txt is unavailable"; exit 1; }
          test -f "${PORTABLE_GENERATE_PATH:-}" || { echo "::error::preserved portable generate.py is unavailable"; exit 1; }
          test -f "${PORTABLE_BUILD_RS_PATH:-}" || { echo "::error::preserved portable build.rs is unavailable"; exit 1; }
          cp -- "$PORTABLE_REQUIREMENTS_PATH" libs/portable/requirements.txt
          cp -- "$PORTABLE_GENERATE_PATH" libs/portable/generate.py
          cp -- "$PORTABLE_BUILD_RS_PATH" libs/portable/build.rs
          chmod +x libs/portable/generate.py
          pushd libs/portable
          pip3 install --require-hashes -r requirements.txt
          # тот же CLI что вызывает build.py (когда --portable БЕЗ --skip-portable-pack).
          # generate.py сам в конце вызывает `cargo build --locked --release` для
          # portable-packer Rust-проекта (см. build_portable() в generate.py).
           python3 ./generate.py \
             -f ../../flutter/build/windows/x64/runner/Release/ \
             -o . \
             -e ../../flutter/build/windows/x64/runner/Release/rustdesk.exe
           popd
           mkdir -p ./output
          src="./target/release/rustdesk-portable-packer.exe"
          if [ ! -f "$src" ]; then
            # libs/portable is a root-workspace member: cargo writes to the root target/
            src="./libs/portable/target/release/rustdesk-portable-packer.exe"
          fi
          test -f "$src" || { echo "FAIL: portable-packer.exe not found"; find . -name "rustdesk-portable-packer.exe" 2>/dev/null; exit 1; }
           cp "$src" "./output/${APP}.exe"
           ls -lh "./output/"
           echo "L4: ${APP}.exe size = $(stat -c%s "./output/${APP}.exe" 2>/dev/null || wc -c < "./output/${APP}.exe")"

      - name: Assert exact output and write artifact manifest
        shell: bash
        env:
          MANIFEST_PLATFORM: windows
          MANIFEST_WORKFLOW_SHA: ${{ github.sha }}
          MANIFEST_WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          MANIFEST_PUBLICATION_TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          export MANIFEST_PUBLICATION_TIMESTAMP
           test -f "${MANIFEST_HELPER_PATH:-}" || { echo "::error::preserved manifest helper is unavailable"; exit 1; }
           python3 "$MANIFEST_HELPER_PATH" \
             --platform "$MANIFEST_PLATFORM" --app-name "$RQS_APP_NAME" --version "$RQS_VERSION" \
             --output output --workflow-sha "$MANIFEST_WORKFLOW_SHA" --workflow-ref "$MANIFEST_WORKFLOW_REF"

      - name: Upload unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustqs-windows
          path: output
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup sensitive custom_.txt
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${RQS_CUSTOM_TXT_FILE:-}" ]; then
            rm -f -- "$RQS_CUSTOM_TXT_FILE"
          fi
