name: rustqs android min test
# ============================================================================
# DRAFT (B-012) — НЕ ВАЛИДИРОВАН РЕАЛЬНЫМ ПРОГОНОМ GITHUB ACTIONS.
# Historical generator-android.yml reference adapted to the fork contract (enc_payload
# + L1/L2/L3); local github-build files are reference material only. Сборка одной
# ABI (arm64-v8a) для min-test. Build-шаги (NDK/cargo-ndk/flutter build apk/пути)
# требуют доводки на реальных прогонах. Draft/unavailable: DeskForge does not
# currently dispatch this workflow; its no-secret `unsupported` gate stops manual
# execution before secret-bearing jobs.
#
# Контракт: единственный build path — authenticated DFP1 enc_payload от API.
# Direct/manual runs without a valid payload fail closed before checkout/build.
#
# Android custom_.txt is packaged as a Flutter asset and handed to the native
# server from MainService before the server thread starts.
#
# Путь в форке: .github/workflows/rustqs-android.yml на ветке rustqs/workflows.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      enc_payload:
        description: 'Authenticated DFP1 payload from the API; manual runs without it fail closed.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  unsupported:
    permissions: {}
    runs-on: ubuntu-22.04
    steps:
      - name: Report unavailable platform
        shell: bash
        run: |
          echo "::error::Android builds are unavailable in DeskForge; only Windows is currently a production capability."
          exit 1

  bridge:
    needs: unsupported
    uses: ./.github/workflows/bridge.yml
    with:
      enc_payload: ${{ inputs.enc_payload }}
      workflow_sha: ${{ github.sha }}
    secrets: inherit

  build:
    needs: [unsupported, bridge]
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpam0g-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      # The API is the only source of build values; direct/manual fallback is
      # intentionally absent and the guard runs before checkout.
      - name: 'Resolve authenticated build config'
        shell: bash
        env:
          ENC: ${{ inputs.enc_payload }}
          PAYLOAD_KEY: ${{ secrets.WORKFLOW_PAYLOAD_KEY }}
        run: |
          set -euo pipefail
          RQS_PAYLOAD_MODE=encrypted
          if [ -z "${ENC:-}" ]; then
            echo "::error::manual/direct runs require an authenticated DFP1 payload; no build is permitted"
            exit 1
          fi
          if [ -z "${PAYLOAD_KEY:-}" ]; then
              echo "::error::enc_payload provided but secret WORKFLOW_PAYLOAD_KEY is not set in this repo"
              exit 1
            fi
            decrypt_payload() {
              local payload_dir magic material aes_key aes_iv ciphertext
              payload_dir=$(mktemp -d)
              magic=$(printf '%s' "$ENC" | base64 -d | dd bs=1 count=4 status=none)
              if [ "$magic" = "DFP1" ]; then
                ciphertext="$payload_dir/ciphertext"
                if ! material=$(PAYLOAD_KEY="$PAYLOAD_KEY" ENC="$ENC" python3 - "$ciphertext" <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import pathlib
          import sys

          raw = base64.b64decode(os.environ["ENC"], validate=True)
          if len(raw) <= 4 + 16 + 32:
              raise SystemExit("authenticated payload is truncated")
          ciphertext = raw[20:-32]
          if not ciphertext or len(ciphertext) % 16:
              raise SystemExit("authenticated payload ciphertext is invalid")
          derived = hashlib.pbkdf2_hmac("sha256", os.environ["PAYLOAD_KEY"].encode(), raw[4:20], 100000, 80)
          expected = hmac.new(derived[48:], raw[:-32], hashlib.sha256).digest()
          if not hmac.compare_digest(expected, raw[-32:]):
              raise SystemExit("authenticated payload integrity check failed")
          pathlib.Path(sys.argv[1]).write_bytes(ciphertext)
          print(derived[:32].hex())
          print(derived[32:48].hex())
          PY
                ); then
                  rm -rf "$payload_dir"
                  return 1
                fi
                aes_key=$(printf '%s\n' "$material" | sed -n '1p')
                aes_iv=$(printf '%s\n' "$material" | sed -n '2p')
                if ! openssl enc -d -aes-256-cbc -K "$aes_key" -iv "$aes_iv" -in "$ciphertext"; then
                  rm -rf "$payload_dir"
                  return 1
                fi
              else
                echo "::error::enc_payload must use the authenticated DFP1 envelope" >&2
                rm -rf "$payload_dir"
                return 1
              fi
              rm -rf "$payload_dir"
            }
            decrypted=$(decrypt_payload)
            RQS_SERVER=$(printf '%s' "$decrypted" | jq -r '.server // ""')
            RQS_KEY=$(printf '%s' "$decrypted" | jq -r '.key // ""')
             RQS_APP=$(printf '%s' "$decrypted" | jq -r '.app_name // ""')
             RQS_ANDROID_APP_ID=$(printf '%s' "$decrypted" | jq -r '.android_app_id // ""')
             RQS_CT=$(printf '%s' "$decrypted" | jq -r '.custom_txt // ""')
            RQS_VERSION=$(printf '%s' "$decrypted" | jq -r '.version // ""')
            RQS_SOURCE_SHA=$(printf '%s' "$decrypted" | jq -r '.source_sha // ""')
            RQS_WORKFLOW_REPO=$(printf '%s' "$decrypted" | jq -r '.workflow_repo // ""')
            if ! printf '%s' "$decrypted" | jq -e '
              (.server == null or (.server | type == "string")) and
              (.key == null or (.key | type == "string")) and
               (.app_name == null or (.app_name | type == "string")) and
               (.android_app_id | type == "string") and
               (.custom_txt == null or (.custom_txt | type == "string")) and
              (.version == null or (.version | type == "string")) and
              (.source_sha == null or (.source_sha | type == "string")) and
              (.workflow_repo | type == "string")
            ' >/dev/null; then
              echo "::error::encrypted payload env-bound fields must be strings"
              exit 1
            fi
          if [ "${RQS_WORKFLOW_REPO,,}" != "${GITHUB_REPOSITORY,,}" ]; then
            echo "::error::authenticated workflow repository does not match this fork"
            exit 1
          fi
          reject_control_chars() {
            local field="$1" value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]] || LC_ALL=C printf '%s' "$value" | LC_ALL=C grep -q '[[:cntrl:]]'; then
              echo "::error::$field contains unsafe control characters"
              exit 1
            fi
          }
          normalize_public_key() {
            local value="$1"
            while [[ "$value" == *$'\r' || "$value" == *$'\n' ]]; do
              value="${value%?}"
            done
            printf '%s' "$value"
          }
          validate_public_key() {
            local value="$1"
            if ! PUBLIC_KEY="$value" python3 - <<'PY'
          import base64
          import os
          import re

          value = os.environ["PUBLIC_KEY"]
          if not re.fullmatch(r"[A-Za-z0-9+/]{43}=", value):
              raise SystemExit("public key must be padded standard base64")
          try:
              raw = base64.b64decode(value, validate=True)
          except ValueError as exc:
              raise SystemExit("public key is not valid standard base64") from exc
          if len(raw) != 32 or base64.b64encode(raw).decode("ascii") != value:
              raise SystemExit("public key must encode exactly 32 bytes canonically")
          PY
            then
              echo "::error::RustDesk public key must be canonical padded base64 for 32 bytes"
              exit 1
            fi
          }
          validate_version() {
            local value="$1" byte_length
            byte_length=$(LC_ALL=C printf '%s' "$value" | wc -c)
            if [ "$byte_length" -gt 32 ] || [[ ! "$value" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?$ ]]; then
              echo "::error::RQS_VERSION must be a strict semantic version"
              exit 1
            fi
          }
          validate_app_name() {
            local value="$1" byte_length
            reject_control_chars app_name "$value"
            byte_length=$(LC_ALL=C printf '%s' "$value" | wc -c)
            if [ -z "$value" ] || [ "$value" = "." ] || [ "$value" = ".." ] || [ "$byte_length" -gt 128 ]; then
               echo "::error::app_name must be a non-empty filename component of at most 128 bytes"
               exit 1
            fi
            if [[ "$value" == @* || "$value" == \?* ]]; then
                echo "::error::app_name must not start with @ or ?"
                exit 1
            fi
            if [[ "$value" == */* || "$value" == *\\* || "$value" == *'<'* || "$value" == *'>'* || "$value" == *:* || "$value" == *'"'* || "$value" == *'|'* || "$value" == *'?'* || "$value" == *'*'* ]]; then
                echo "::error::app_name contains unsafe filename characters"
                exit 1
            fi
            case "$value" in
              *.|*' ') echo "::error::app_name must not end in a dot or space"; exit 1 ;;
            esac
            if is_windows_reserved_device_name "$value"; then
              echo "::error::app_name uses a reserved Windows device name"
              exit 1
            fi
          }
          validate_android_app_id() {
            local value="$1" byte_length
            reject_control_chars android_app_id "$value"
            byte_length=$(LC_ALL=C printf '%s' "$value" | wc -c)
            if [ "$byte_length" -gt 255 ] || [[ ! "$value" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
              echo "::error::android_app_id must be a lowercase Java package identifier"
              exit 1
            fi
          }
          is_windows_reserved_device_name() {
            local value="$1" base
            base="${value%%.*}"
            while [[ "$base" == *" " || "$base" == *"." ]]; do
              base="${base%?}"
            done
            case "${base^^}" in
              CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9]) return 0 ;;
              *) return 1 ;;
            esac
          }
          write_github_env() {
            local name="$1" value="$2"
            reject_control_chars "$name" "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }
          if [ -n "$RQS_KEY" ]; then
            RQS_KEY=$(normalize_public_key "$RQS_KEY")
          fi
          for field_value in \
            "RQS_SERVER=$RQS_SERVER" \
            "RQS_KEY=$RQS_KEY" \
            "RQS_CUSTOM_TXT=$RQS_CT" \
            "RQS_VERSION=$RQS_VERSION" \
            "RQS_SOURCE_SHA=$RQS_SOURCE_SHA" \
            "RQS_WORKFLOW_REPO=$RQS_WORKFLOW_REPO"; do
            field_name=${field_value%%=*}
            field_value=${field_value#*=}
            reject_control_chars "$field_name" "$field_value"
          done
          validate_app_name "$RQS_APP"
          validate_android_app_id "$RQS_ANDROID_APP_ID"
          if [ -n "$RQS_KEY" ]; then
            validate_public_key "$RQS_KEY"
          fi
          if [ -n "$RQS_VERSION" ]; then
            validate_version "$RQS_VERSION"
          fi
          if ! printf '%s' "$decrypted" | jq -e '.source_sha | type == "string"' >/dev/null; then
              echo "::error::encrypted payload source_sha must be a string"
              exit 1
          fi
          if [ -z "$RQS_SOURCE_SHA" ]; then
              echo "::error::encrypted payload is missing source_sha"
              exit 1
          fi
          if ! printf '%s' "$RQS_SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40,64}$'; then
              echo "::error::encrypted payload source_sha must be a hexadecimal commit SHA"
              exit 1
          fi
          for v in "$RQS_KEY" "$RQS_CT"; do [ -n "$v" ] && echo "::add-mask::$v" || true; done
          write_github_env RQS_PAYLOAD_MODE "$RQS_PAYLOAD_MODE"
          write_github_env RQS_SERVER "$RQS_SERVER"
          write_github_env RQS_KEY "$RQS_KEY"
          write_github_env RQS_APP_NAME "$RQS_APP"
          write_github_env RQS_ANDROID_APP_ID "$RQS_ANDROID_APP_ID"
          # Keep password-bearing custom_.txt content out of GITHUB_ENV. The
          # exact source_sha checkout/integrity check below is the trusted-source
          # gate; this restrictive path is shared only to the packaging step.
           if [ -n "$RQS_CT" ]; then
             custom_txt_file="${RUNNER_TEMP}/rustdesk-custom-${GITHUB_RUN_ID:-local}.txt"
             cleanup_custom_txt_on_failure() {
               status=$?
               if [ "$status" -ne 0 ]; then rm -f -- "$custom_txt_file"; fi
               trap - EXIT
               exit "$status"
             }
             trap cleanup_custom_txt_on_failure EXIT
             (umask 077; printf '%s' "$RQS_CT" > "$custom_txt_file")
             if ! python3 - "$custom_txt_file" <<'PY'
          import base64
          import json
          import pathlib
          import sys

          try:
              decoded = base64.b64decode(pathlib.Path(sys.argv[1]).read_text(), validate=True)
              value = json.loads(decoded)
          except (ValueError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit("custom_.txt does not match the Android native client config contract") from exc
          if not isinstance(value, dict):
              raise SystemExit("custom_.txt native client config must be a JSON object")
          PY
             then
               echo "::error::custom_.txt does not match the Android native client config contract"
               exit 1
             fi
             chmod 600 "$custom_txt_file"
             write_github_env RQS_CUSTOM_TXT_FILE "$custom_txt_file"
          else
            write_github_env RQS_CUSTOM_TXT_FILE ""
          fi
          write_github_env RQS_VERSION "$RQS_VERSION"
          write_github_env RQS_SOURCE_SHA "$RQS_SOURCE_SHA"
          write_github_env RQS_WORKFLOW_REPO "$RQS_WORKFLOW_REPO"
          echo "config: mode=$RQS_PAYLOAD_MODE"
          echo "config: source_sha=SET"

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Preserve workflow manifest helper
        shell: bash
        run: |
          set -euo pipefail
          source_helper=.github/scripts/write_artifact_manifest.py
          helper_path="${RUNNER_TEMP}/deskforge-write_artifact_manifest.py"
          test -f "$source_helper" || { echo "::error::workflow-owned manifest helper is missing"; exit 1; }
          cp -- "$source_helper" "$helper_path"
          chmod 700 "$helper_path"
          printf 'MANIFEST_HELPER_PATH=%s\n' "$helper_path" >> "$GITHUB_ENV"

      - name: Checkout source commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RQS_SOURCE_SHA:-}" ]; then
            echo "::error::authenticated payload source_sha is required"
            exit 1
          fi
          if ! printf '%s' "$RQS_SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40,64}$'; then
            echo "::error::source_sha must be a hexadecimal commit SHA"
            exit 1
          fi
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="Authorization: Bearer ${{ github.token }}" \
            git fetch --no-tags --depth=1 origin "$RQS_SOURCE_SHA"
          git checkout --detach "$RQS_SOURCE_SHA"
          git submodule sync --recursive
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="Authorization: Bearer ${{ github.token }}" \
            git submodule update --init --recursive
          expected=$(printf '%s' "$RQS_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')
           actual=$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')
           [ "$actual" = "$expected" ] || { echo "::error::source checkout SHA mismatch"; exit 1; }

      - name: Set deterministic source timestamp
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]] || { echo "::error::invalid commit timestamp"; exit 1; }
          printf 'SOURCE_DATE_EPOCH=%s\n' "$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      # Override VERSION from encrypted payload (takes precedence over workflow-level default).
      - name: 'Override VERSION from dispatch payload'
        if: env.RQS_VERSION != ''
        shell: bash
        run: |
          if [ "${#RQS_VERSION}" -gt 32 ] || [[ ! "$RQS_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?$ ]]; then
            echo "::error::RQS_VERSION must be a strict semantic version"
            exit 1
          fi
          printf '%s=%s\n' VERSION "$RQS_VERSION" >> "$GITHUB_ENV"
          echo "VERSION overridden from dispatch: $RQS_VERSION"

      # L1: server+key в config.rs (платформо-независимо).
      - name: 'L1 inject: server + key into hbb_common/config.rs'
        if: env.RQS_SERVER != '' || env.RQS_KEY != ''
        shell: bash
        run: |
          set -eu
          f=libs/hbb_common/src/config.rs
          if [ -n "${RQS_SERVER:-}" ]; then
            esc=$(printf '%s' "$RQS_SERVER" | sed -e 's/[\/&]/\\&/g')
            sed -i "s/rs-ny\.rustdesk\.com/${esc}/" "$f"
            grep -F -q -- "$RQS_SERVER" "$f" || { echo "L1: server marker not found"; exit 1; }
          fi
          if [ -n "${RQS_KEY:-}" ]; then
            esc=$(printf '%s' "$RQS_KEY" | sed -e 's/[\/&]/\\&/g')
            sed -i "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${esc}|" "$f"
            grep -F -q -- "$RQS_KEY" "$f" || { echo "L1: key marker not found"; exit 1; }
          fi

      # L2: allowCustom (платформо-независимо).
      - name: 'L2 patch: allowCustom'
        if: env.RQS_CUSTOM_TXT_FILE != ''
        shell: bash
        run: |
          set -eu
          python3 .github/patches/rdgen-allowCustom.py
          if grep -q '5Qbwsde3unUcJBtrx9ZkvUmwFNoExHzpryHuPUdqlWM=' src/common.rs; then
            echo "L2: allowCustom FAILED"; exit 1
          fi

      # L3: брендинг (Cargo.toml + lang).
      - name: 'L3 brand: rename RustDesk → app_name'
        if: env.RQS_APP_NAME != ''
        shell: bash
        run: |
          set -eu
          esc=$(printf '%s' "$RQS_APP_NAME" | sed -e 's/[\/&]/\\&/g')
          sed -i -e "s|description = \"RustDesk Remote Desktop\"|description = \"${esc}\"|" Cargo.toml
           find ./src/lang -name "*.rs" -exec sed -i -e "s|RustDesk|${esc}|" {} \;

      - name: 'Apply Android identity'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RQS_ANDROID_APP_ID:-}" || { echo "::error::android_app_id is required before Android build"; exit 1; }
          test -n "${RQS_APP_NAME:-}" || { echo "::error::app_name is required before Android build"; exit 1; }
          ANDROID_APP_ID="$RQS_ANDROID_APP_ID" ANDROID_APP_LABEL="$RQS_APP_NAME" python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from xml.sax.saxutils import escape

          def escape_android_string(value):
              if value.startswith(("@", "?")):
                  raise SystemExit("Android app_name must not start with @ or ?")
              value = value.replace("\\", "\\\\")
              value = value.replace("'", "\\'").replace('"', '\\"')
              return escape(value)

          app_id = os.environ["ANDROID_APP_ID"]
          app_label = escape_android_string(os.environ["ANDROID_APP_LABEL"])
          gradle = Path("flutter/android/app/build.gradle")
          if not re.fullmatch(r"[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+", app_id) or len(app_id) > 255:
              raise SystemExit("android_app_id failed the Android package contract")
          gradle_text = gradle.read_text()
          if 'namespace "com.carriez.flutter_hbb"' not in gradle_text:
              raise SystemExit("Android namespace marker is missing")
          if 'applicationId "com.carriez.flutter_hbb"' not in gradle_text:
              raise SystemExit("Android Gradle applicationId marker is missing")
          gradle.write_text(gradle_text.replace('applicationId "com.carriez.flutter_hbb"', f'applicationId "{app_id}"', 1))

          manifest = Path("flutter/android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest.read_text()
          marker = 'package="com.carriez.flutter_hbb"'
          if manifest_text.count(marker) != 1:
              raise SystemExit("Android manifest package marker is missing or ambiguous")

          strings = Path("flutter/android/app/src/main/res/values/strings.xml")
          strings_text = strings.read_text()
          replaced = re.sub(
              r'(<string name="app_name">).*?(</string>)',
              lambda match: f"{match.group(1)}{app_label}{match.group(2)}",
              strings_text,
              count=1,
          )
          if replaced == strings_text:
              raise SystemExit("Android app_name resource marker is missing")
          strings.write_text(replaced)
          PY
          grep -F -q -- "applicationId \"$RQS_ANDROID_APP_ID\"" flutter/android/app/build.gradle
          grep -F -q -- 'namespace "com.carriez.flutter_hbb"' flutter/android/app/build.gradle
          grep -F -q -- 'package="com.carriez.flutter_hbb"' flutter/android/app/src/main/AndroidManifest.xml

      # L2 payload: Flutter packages assets/ below flutter_assets/ in the APK;
      # MainService reads this asset and passes it to the native client contract.
      - name: 'L2 payload: place custom_.txt into flutter assets'
        shell: bash
        run: |
          set -eu
           if [ -n "${RQS_CUSTOM_TXT_FILE:-}" ]; then
             mkdir -p flutter/assets
             trap 'rm -f -- "$RQS_CUSTOM_TXT_FILE"' EXIT
             cp -- "$RQS_CUSTOM_TXT_FILE" flutter/assets/custom_.txt
             test -f flutter/assets/custom_.txt || { echo "FAIL: custom_.txt asset was not staged"; exit 1; }
             ls -la flutter/assets/custom_.txt
           else
             test ! -e flutter/assets/custom_.txt || { echo "FAIL: absent custom_.txt payload has a stale Android asset"; exit 1; }
           fi

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: "rustfmt"

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          prefix-key: android-arm64

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ${{ runner.temp }}/deskforge-bridge-artifact

      - name: Verify and restore bridge files
        shell: bash
        env:
          BRIDGE_ARTIFACT_DIR: ${{ runner.temp }}/deskforge-bridge-artifact
          BRIDGE_WORKFLOW_SHA: ${{ github.sha }}
          BRIDGE_WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test -f "${MANIFEST_HELPER_PATH:-}" || { echo "::error::preserved manifest helper is unavailable"; exit 1; }
          python3 "$MANIFEST_HELPER_PATH" \
            --verify-bridge --output "$BRIDGE_ARTIFACT_DIR" \
            --expected-source-sha "$RQS_SOURCE_SHA" \
            --expected-version "$RQS_VERSION" \
            --workflow-sha "$BRIDGE_WORKFLOW_SHA" --workflow-ref "$BRIDGE_WORKFLOW_REF"
          bridge_files=(
            flutter/ios/Runner/bridge_generated.h
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            src/bridge_generated.io.rs
            src/bridge_generated.rs
          )
          for file in "${bridge_files[@]}"; do
            mkdir -p "$(dirname "$file")"
            cp -- "$BRIDGE_ARTIFACT_DIR/$file" "$file"
            test -f "$file" || { echo "::error::restored bridge file is missing from source path: $file"; exit 1; }
          done

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (opus, vpx, ffmpeg, etc.) for Android arm64
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
        run: |
          ./flutter/build_android_deps.sh arm64-v8a

      - name: Build rustdesk native lib (via ndk_arm64.sh)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
        run: |
          set -euo pipefail
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          # Verify native lib was built before copying
          if [ ! -f ./target/aarch64-linux-android/release/liblibrustdesk.so ]; then
            echo "::error::librustdesk.so not found after cargo ndk build"
            find ./target/aarch64-linux-android/release -name '*.so' 2>/dev/null || true
            exit 1
          fi
          # Copy native lib from target to jniLibs
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          # Copy libc++_shared.so from NDK sysroot
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          ls -lh ./flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK (flutter, arm64)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -eu
          APP="$RQS_APP_NAME"
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Increase Gradle JVM memory for CI builds
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Use debug signing config (no release key in CI)
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          # Ensure jniLibs are in place
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so 2>/dev/null || true
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          pushd flutter
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi
           popd
           mkdir -p ./output
           apk="flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
           test -f "$apk" || { echo "FAIL: expected APK not found at $apk"; exit 1; }
           apk_count=$(python3 -c 'from pathlib import Path; print(sum(1 for path in Path("flutter/build/app/outputs/flutter-apk").glob("*.apk") if path.is_file()))')
           [ "$apk_count" = "1" ] || { echo "FAIL: expected exactly one arm64 APK, found $apk_count"; exit 1; }
           if [ -n "${RQS_CUSTOM_TXT_FILE:-}" ]; then
             test -f flutter/assets/custom_.txt || { echo "FAIL: payload custom_.txt asset is missing before APK publication"; exit 1; }
             python3 - "$apk" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          required = "assets/flutter_assets/assets/custom_.txt"
          with zipfile.ZipFile(apk) as archive:
              if required not in archive.namelist():
                  raise SystemExit("FAIL: custom_.txt is not packaged in Flutter Android assets")
          PY
           fi
           cp "$apk" "./output/${APP}.apk"
           ls -lh ./output/

      - name: Assert exact output and write artifact manifest
        shell: bash
        env:
          MANIFEST_PLATFORM: android
          MANIFEST_WORKFLOW_SHA: ${{ github.sha }}
          MANIFEST_WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          MANIFEST_PUBLICATION_TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          export MANIFEST_PUBLICATION_TIMESTAMP
           test -f "${MANIFEST_HELPER_PATH:-}" || { echo "::error::preserved manifest helper is unavailable"; exit 1; }
           python3 "$MANIFEST_HELPER_PATH" \
             --platform "$MANIFEST_PLATFORM" --app-name "$RQS_APP_NAME" --version "$RQS_VERSION" \
             --output output --workflow-sha "$MANIFEST_WORKFLOW_SHA" --workflow-ref "$MANIFEST_WORKFLOW_REF"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-min-test-android
          path: output
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup sensitive custom_.txt
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${RQS_CUSTOM_TXT_FILE:-}" ]; then
            rm -f -- "$RQS_CUSTOM_TXT_FILE"
          fi
