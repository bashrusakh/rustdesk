name: build RustDeskTempTopMostWindow

on:
  workflow_call:
    inputs:
        upload-artifact:
          type: boolean
          default: true
        target:
            description: 'Target'
            required: true
            type: string
            default: 'windows-2022'
        configuration:
            description: 'Configuration'
            required: true
            type: string
            default: 'Release'
        platform:
            description: 'Platform'
            required: true
            type: string
            default: 'x64'
        target_version:
            description: 'TargetVersion'
            required: true
            type: string
            default: 'Windows10'
        privacy-image-artifact:
            description: 'Name of a same-run artifact carrying privacy-screen.png + sha256 branding manifest (DeskForge #80). Empty keeps the pinned default overlay image.'
            required: false
            type: string
            default: ''

permissions:
  contents: read

env:
  project_path: WindowInjection/WindowInjection.vcxproj

jobs:
  build-RustDeskTempTopMostWindow:
    runs-on: ${{ inputs.target }}
    strategy:
        fail-fast: false
    env:
      build_output_dir: third_party/windows/RustDeskTempTopMostWindow/WindowInjection/${{ inputs.platform }}/${{ inputs.configuration }}
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Configure checkout line endings
        # Owned vendor roots are digested byte-for-byte; CRLF checkout breaks them.
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate pinned local source
        shell: pwsh
        run: |
          $expectedCommit = 'ecd8d6a139eee76845ea66423fb739af450fda90'
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'third_party/windows/RustDeskTempTopMostWindow'
          if (-not (Test-Path (Join-Path $sourceRoot 'WindowInjection/WindowInjection.vcxproj'))) {
            throw "Pinned RustDeskTempTopMostWindow source is missing: $sourceRoot"
          }
           python scripts/check-flutter-source-ownership.py --require-window-pin RustDeskTempTopMostWindow $expectedCommit
           if ($LASTEXITCODE -ne 0) {
             throw "RustDeskTempTopMostWindow ownership pin validation failed: expected record path and ref"
           }

      # DeskForge #80 privacy_screen_url consumer: replace WindowInjection/img.cpp
      # (the fullscreen overlay image g_img rendered while privacy mode is active)
      # with the provider-supplied image. Runs AFTER the pinned-source validation so
      # the pin still proves the pristine state; the patch itself re-asserts the
      # exact img.cpp/img.h anchors and aborts the build on mismatch. The PNG is
      # converted with the same mechanism the deskforge generator historically
      # used (.github/patches/rdgen-privacyScreen.py) and the result is verified
      # byte-for-byte by extracting the array again before it is copied over.
      - name: Restore branded privacy screen image
        if: ${{ inputs.privacy-image-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.privacy-image-artifact }}
          path: ${{ runner.temp }}/deskforge-privacy-screen

      - name: 'Brand privacy screen: replace WindowInjection img.cpp'
        if: ${{ inputs.privacy-image-artifact != '' }}
        shell: bash
        run: |
          set -euo pipefail
          img_root=third_party/windows/RustDeskTempTopMostWindow/WindowInjection
          img_cpp="$img_root/img.cpp"
          img_h="$img_root/img.h"
          if [ ! -f "$img_cpp" ]; then
            echo "::error::privacy screen anchor missing: $img_cpp not found in the pinned source"
            exit 1
          fi
          if [ ! -f "$img_h" ]; then
            echo "::error::privacy screen anchor missing: $img_h not found in the pinned source"
            exit 1
          fi
          if ! grep -F '#include "./img.h"' "$img_cpp" >/dev/null; then
            echo "::error::privacy screen anchor mismatch in $img_cpp (img.h include missing or changed); build aborted"
            exit 1
          fi
          if ! grep -F 'const unsigned char g_img[]' "$img_cpp" >/dev/null; then
            echo "::error::privacy screen anchor mismatch in $img_cpp (g_img array missing or changed); build aborted"
            exit 1
          fi
          if ! grep -F 'extern const unsigned char g_img' "$img_h" >/dev/null; then
            echo "::error::privacy screen anchor mismatch in $img_h (g_img declaration missing or changed); build aborted"
            exit 1
          fi
          privacy_png="${RUNNER_TEMP}/deskforge-privacy-screen/privacy-screen.png"
          if [ ! -f "$privacy_png" ]; then
            echo "::error::branded privacy screen image missing from the branding artifact (expected privacy-screen.png)"
            exit 1
          fi
          if ! python3 - "$privacy_png" <<'PY'
          import struct
          import sys
          data = open(sys.argv[1], "rb").read()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              print("::error::privacy-screen.png is not a PNG image"); raise SystemExit(1)
          if len(data) > 20 * 1024 * 1024:
              print("::error::privacy-screen.png exceeds the 20 MB byte cap"); raise SystemExit(1)
          try:
              width, height, depth, color_type, _c, _f, interlace = struct.unpack(">IIBBBBB", data[16:29])
          except struct.error:
              print("::error::privacy-screen.png has an unreadable PNG header"); raise SystemExit(1)
          if interlace != 0 or depth != 8:
              print("::error::privacy-screen.png must be non-interlaced 8-bit"); raise SystemExit(1)
          if not 1 <= width <= 4096 or not 1 <= height <= 4096:
              print("::error::privacy-screen.png dimensions out of range " + str(width) + "x" + str(height) + " (max 4096x4096, fullscreen overlay image)"); raise SystemExit(1)
          PY
          then
            echo "::error::privacy screen image sanity checks failed"
            exit 1
          fi
          convert_dir="$RUNNER_TEMP/deskforge-privacy-convert"
          rm -rf "$convert_dir"
          mkdir -p "$convert_dir"
          patch_script="$(pwd)/.github/patches/rdgen-privacyScreen.py"
          if [ ! -f "$patch_script" ]; then
            echo "::error::workflow-owned privacy screen converter is missing: .github/patches/rdgen-privacyScreen.py"
            exit 1
          fi
          cp -- "$privacy_png" "$convert_dir/privacy.png"
          (cd "$convert_dir" && python3 "$patch_script") || { echo "::error::privacy screen img.cpp conversion failed"; exit 1; }
          if ! python3 - "$convert_dir/img.cpp" "$privacy_png" <<'PY'
          # Verify the generated img.cpp embeds exactly the provider image bytes.
          import re
          import sys
          import binascii
          data = open(sys.argv[1], "r", encoding="ascii", errors="strict").read()
          match = re.search(r"const unsigned char g_img\[\] = \{(.*?)\};", data, re.DOTALL)
          if not match:
              print("::error::converted img.cpp has no g_img array"); raise SystemExit(1)
          hexbytes = re.findall(r"0x[0-9a-fA-F]{2}", match.group(1))
          wanted = open(sys.argv[2], "rb").read()
          if [int(h, 16) for h in hexbytes] != list(wanted):
              print("::error::converted img.cpp does not round-trip to the provider image bytes"); raise SystemExit(1)
          PY
          then
            echo "::error::privacy screen img.cpp round-trip check failed"
            exit 1
          fi
          cp -- "$convert_dir/img.cpp" "$img_cpp"
          echo "privacy screen image replaced: $img_cpp ($(wc -c < "$img_cpp") bytes)"

      - name: Build the project
        run: |
          msbuild third_party/windows/RustDeskTempTopMostWindow/${{ env.project_path }} -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.platform }} /p:TargetVersion=${{ inputs.target_version }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.upload-artifact }}
        with:
          name: topmostwindow-artifacts-${{ inputs.platform }}
          path: |
            ./${{ env.build_output_dir }}/WindowInjection.dll
          retention-days: 7
          if-no-files-found: error
