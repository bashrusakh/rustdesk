name: build RustDeskTempTopMostWindow

on:
  workflow_call:
    inputs:
        upload-artifact:
          type: boolean
          default: true
        target:
            description: 'Target'
            required: true
            type: string
            default: 'windows-2022'
        configuration:
            description: 'Configuration'
            required: true
            type: string
            default: 'Release'
        platform:
            description: 'Platform'
            required: true
            type: string
            default: 'x64'
        target_version:
            description: 'TargetVersion'
            required: true
            type: string
            default: 'Windows10'
        privacy-image-artifact:
            description: 'Name of a same-run artifact carrying privacy-screen.png + sha256 branding manifest (DeskForge #80). Empty keeps the pinned default overlay image.'
            required: false
            type: string
            default: ''

permissions:
  contents: read

env:
  project_path: WindowInjection/WindowInjection.vcxproj

jobs:
  build-RustDeskTempTopMostWindow:
    runs-on: ${{ inputs.target }}
    strategy:
        fail-fast: false
    env:
      build_output_dir: third_party/windows/RustDeskTempTopMostWindow/WindowInjection/${{ inputs.platform }}/${{ inputs.configuration }}
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Configure checkout line endings
        # Owned vendor roots are digested byte-for-byte; CRLF checkout breaks them.
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate pinned local source
        shell: pwsh
        run: |
          $expectedCommit = 'ecd8d6a139eee76845ea66423fb739af450fda90'
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'third_party/windows/RustDeskTempTopMostWindow'
          if (-not (Test-Path (Join-Path $sourceRoot 'WindowInjection/WindowInjection.vcxproj'))) {
            throw "Pinned RustDeskTempTopMostWindow source is missing: $sourceRoot"
          }
           python scripts/check-flutter-source-ownership.py --require-window-pin RustDeskTempTopMostWindow $expectedCommit
           if ($LASTEXITCODE -ne 0) {
             throw "RustDeskTempTopMostWindow ownership pin validation failed: expected record path and ref"
           }

      # DeskForge #80 privacy_screen_url consumer: replace WindowInjection/img.cpp
      # (the fullscreen overlay image g_img rendered while privacy mode is active)
      # with the provider-supplied image. Runs AFTER the pinned-source validation so
      # the pin still proves the pristine state; the patch itself re-asserts the
      # exact img.cpp/img.h anchors and aborts the build on mismatch. The PNG is
      # converted with the same mechanism the deskforge generator historically
      # used (.github/patches/rdgen-privacyScreen.py) and the result is verified
      # byte-for-byte by extracting the array again before it is copied over.
      - name: Restore branded privacy screen image
        if: ${{ inputs.privacy-image-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.privacy-image-artifact }}
          path: ${{ runner.temp }}/deskforge-privacy-screen

      - name: 'Brand privacy screen: replace WindowInjection img.cpp'
        if: ${{ inputs.privacy-image-artifact != '' }}
        shell: bash
        run: |
          set -euo pipefail
          img_root=third_party/windows/RustDeskTempTopMostWindow/WindowInjection
          img_cpp="$img_root/img.cpp"
          img_h="$img_root/img.h"
          if [ ! -f "$img_cpp" ]; then
            echo "::error::privacy screen anchor missing: $img_cpp not found in the pinned source"
            exit 1
          fi
          if [ ! -f "$img_h" ]; then
            echo "::error::privacy screen anchor missing: $img_h not found in the pinned source"
            exit 1
          fi
          if ! grep -F '#include "./img.h"' "$img_cpp" >/dev/null; then
            echo "::error::privacy screen anchor mismatch in $img_cpp (img.h include missing or changed); build aborted"
            exit 1
          fi
          if ! grep -F 'const unsigned char g_img[]' "$img_cpp" >/dev/null; then
            echo "::error::privacy screen anchor mismatch in $img_cpp (g_img array missing or changed); build aborted"
            exit 1
          fi
          if ! grep -F 'extern const unsigned char g_img' "$img_h" >/dev/null; then
            echo "::error::privacy screen anchor mismatch in $img_h (g_img declaration missing or changed); build aborted"
            exit 1
          fi
          privacy_png="${RUNNER_TEMP}/deskforge-privacy-screen/privacy-screen.png"
          if [ ! -f "$privacy_png" ]; then
            echo "::error::branded privacy screen image missing from the branding artifact (expected privacy-screen.png)"
            exit 1
          fi
          manifest_json="${RUNNER_TEMP}/deskforge-privacy-screen/branding_manifest.json"
          if [ ! -f "$manifest_json" ]; then
            echo "::error::privacy screen branding manifest missing from the artifact (expected branding_manifest.json); build aborted"
            exit 1
          fi
          # The third-party job trusts nothing between prepare and here: verify the
          # sha256 manifest entry, then fully validate the image (complete chunk
          # stream: IHDR first, per-chunk CRC, IEND at EOF, decodable pixel data)
          # before replacing the privacy overlay. A truncated/corrupt payload fails
          # here instead of embedding undecodable bytes into g_img.
          if ! python3 - "$privacy_png" "$manifest_json" <<'PY'
          import hashlib
          import json
          import struct
          import sys
          import zlib

          def fail(message):
              print("::error::" + message)
              raise SystemExit(1)

          data = open(sys.argv[1], "rb").read()
          try:
              manifest = json.loads(open(sys.argv[2], encoding="utf-8").read())["images"]
          except Exception as exc:
              fail("privacy screen branding manifest is not readable: " + str(exc))
          entry = manifest.get("privacy-screen.png") or {}
          if not entry.get("sha256"):
              fail("branding manifest has no sha256 entry for privacy-screen.png; build aborted")
          if hashlib.sha256(data).hexdigest() != entry["sha256"]:
              fail("privacy-screen.png digest does not match the prepared manifest; build aborted")
          if len(data) < 33:
              fail("privacy-screen.png is too small to be a PNG image")
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              fail("privacy-screen.png is not a PNG image")
          if len(data) > 20 * 1024 * 1024:
              fail("privacy-screen.png exceeds the 20 MB byte cap")
          # Full structural walk of the PNG chunk stream (fail-on-truncation).
          pos = 8
          count = 0
          ihdr = None
          plte = None
          idat = b""
          ended = False
          while pos < len(data):
              if len(data) - pos < 8:
                  fail("privacy-screen.png ends inside a chunk header (truncated)")
              (length,) = struct.unpack(">I", data[pos:pos + 4])
              ctype = data[pos + 4:pos + 8]
              if pos + 12 + length > len(data):
                  fail("privacy-screen.png chunk extends past its declared length (truncated)")
              chunk = data[pos + 8:pos + 8 + length]
              (crc,) = struct.unpack(">I", data[pos + 8 + length:pos + 12 + length])
              if (zlib.crc32(ctype + chunk) & 0xFFFFFFFF) != crc:
                  fail("privacy-screen.png chunk CRC mismatch")
              if count == 0 and ctype != b"IHDR":
                  fail("privacy-screen.png first chunk is not IHDR")
              if ended:
                  fail("privacy-screen.png has data after IEND")
              if ctype == b"IEND":
                  ended = True
              elif ctype == b"IHDR":
                  ihdr = chunk
              elif ctype == b"PLTE":
                  plte = chunk
              elif ctype == b"IDAT":
                  idat = idat + chunk
              pos += 12 + length
              count += 1
          if not ended:
              fail("privacy-screen.png is truncated (no IEND chunk)")
          if ihdr is None or len(ihdr) != 13:
              fail("privacy-screen.png has an unreadable IHDR chunk")
          try:
              width, height, depth, color_type, _compression, _filter, interlace = struct.unpack(">IIBBBBB", ihdr)
          except struct.error:
              fail("privacy-screen.png has an unreadable PNG header")
          if interlace != 0 or depth != 8:
              fail("privacy-screen.png must be non-interlaced 8-bit")
          if _compression != 0 or _filter != 0:
              fail("privacy-screen.png uses unsupported compression/filter method flags")
          if not 1 <= width <= 4096 or not 1 <= height <= 4096:
              fail("privacy-screen.png dimensions out of range " + str(width) + "x" + str(height) + " (max 4096x4096, fullscreen overlay image)")
          channels = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}.get(color_type)
          if channels is None:
              fail("privacy-screen.png uses unsupported PNG color type " + str(color_type))
          if color_type == 3 and not plte:
              fail("privacy-screen.png palette PNG is missing its PLTE chunk")
          if not idat:
              fail("privacy-screen.png has no image data")
          # Full pixel-data decode: complete decompressed stream and valid scanline
          # filters on every row prove the image decodes end to end.
          try:
              raw = zlib.decompress(idat)
          except zlib.error as exc:
              fail("privacy-screen.png image data is corrupt: " + str(exc))
          stride = width * channels
          if len(raw) < height * (stride + 1):
              fail("privacy-screen.png image data is incomplete (truncated)")
          prev = bytearray(stride)
          off = 0
          for _y in range(height):
              ftype = raw[off]
              off += 1
              row = bytearray(raw[off:off + stride])
              off += stride
              for i in range(stride):
                  a_ = row[i - channels] if i >= channels else 0
                  b_ = prev[i]
                  c_ = prev[i - channels] if i >= channels else 0
                  if ftype == 1:
                      row[i] = (row[i] + a_) & 0xFF
                  elif ftype == 2:
                      row[i] = (row[i] + b_) & 0xFF
                  elif ftype == 3:
                      row[i] = (row[i] + (a_ + b_) // 2) & 0xFF
                  elif ftype == 4:
                      p_ = a_ + b_ - c_
                      pa, pb, pc = abs(p_ - a_), abs(p_ - b_), abs(p_ - c_)
                      pr = a_ if pa <= pb and pa <= pc else (b_ if pb <= pc else c_)
                      row[i] = (row[i] + pr) & 0xFF
                  elif ftype != 0:
                      fail("privacy-screen.png uses an unknown scanline filter")
              prev = row
          print("privacy-screen.png verified: digest matches manifest, chunk stream complete, fully decodable " + str(width) + "x" + str(height))
          PY
          then
            echo "::error::privacy screen image sanity checks failed"
            exit 1
          fi
          convert_dir="$RUNNER_TEMP/deskforge-privacy-convert"
          rm -rf "$convert_dir"
          mkdir -p "$convert_dir"
          patch_script="$(pwd)/.github/patches/rdgen-privacyScreen.py"
          if [ ! -f "$patch_script" ]; then
            echo "::error::workflow-owned privacy screen converter is missing: .github/patches/rdgen-privacyScreen.py"
            exit 1
          fi
          cp -- "$privacy_png" "$convert_dir/privacy.png"
          (cd "$convert_dir" && python3 "$patch_script") || { echo "::error::privacy screen img.cpp conversion failed"; exit 1; }
          if ! python3 - "$convert_dir/img.cpp" "$privacy_png" <<'PY'
          # Verify the generated img.cpp embeds exactly the provider image bytes.
          import re
          import sys
          import binascii
          data = open(sys.argv[1], "r", encoding="ascii", errors="strict").read()
          match = re.search(r"const unsigned char g_img\[\] = \{(.*?)\};", data, re.DOTALL)
          if not match:
              print("::error::converted img.cpp has no g_img array"); raise SystemExit(1)
          hexbytes = re.findall(r"0x[0-9a-fA-F]{2}", match.group(1))
          wanted = open(sys.argv[2], "rb").read()
          if [int(h, 16) for h in hexbytes] != list(wanted):
              print("::error::converted img.cpp does not round-trip to the provider image bytes"); raise SystemExit(1)
          PY
          then
            echo "::error::privacy screen img.cpp round-trip check failed"
            exit 1
          fi
          cp -- "$convert_dir/img.cpp" "$img_cpp"
          echo "privacy screen image replaced: $img_cpp ($(wc -c < "$img_cpp") bytes)"

      - name: Build the project
        run: |
          msbuild third_party/windows/RustDeskTempTopMostWindow/${{ env.project_path }} -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.platform }} /p:TargetVersion=${{ inputs.target_version }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.upload-artifact }}
        with:
          name: topmostwindow-artifacts-${{ inputs.platform }}
          path: |
            ./${{ env.build_output_dir }}/WindowInjection.dll
          retention-days: 7
          if-no-files-found: error
